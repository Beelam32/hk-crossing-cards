<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta name="description" content="全港停車場實時車位｜591 個場、每 90 秒更新">
<title>香港泊車 · 實時車位</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="香港泊車">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Ctext x='32' y='45' font-size='36' font-family='system-ui' font-weight='700' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --ink:#15161a; --ink2:#6b6e78; --line:#e6e3dc;
  --ok:#12855a; --warn:#c97a06; --bad:#c0392b; --accent:#15161a;
  --hdr:104px; --foot:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;
}
/* ---------- header ---------- */
header{padding:calc(8px + env(safe-area-inset-top)) 14px 0;flex:0 0 auto;background:var(--bg);z-index:30}
.hrow{display:flex;align-items:baseline;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:700}
.hsub{font-size:11.5px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.3}
.search{display:flex;gap:8px;margin:9px 0 8px}
.search input{
  flex:1;min-width:0;height:38px;border:1px solid var(--line);background:#fff;
  border-radius:11px;padding:0 12px;font-size:15px;color:var(--ink);outline:none;
}
.search input:focus{border-color:#b9b6ae}
.geo{
  width:38px;height:38px;flex:0 0 38px;border:1px solid var(--line);background:#fff;
  border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--ink2)
}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 9px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:999px;padding:6px 12px;font-size:13px;line-height:1;white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select.chip{
  -webkit-appearance:none;appearance:none;padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,#9a978f 50%),linear-gradient(135deg,#9a978f 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-top:7px;padding-bottom:7px
}
select.chip.on{background-color:var(--accent);border-color:var(--accent);color:#fff}
.banner{
  display:flex;align-items:center;gap:9px;background:#eef4ff;border:1px solid #d7e3fa;color:#1c4b8f;
  border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.35
}
.banner b{font-weight:650}
.banner .x{margin-left:auto;color:#5a7bb0;font-size:16px;padding:0 2px}
/* ---------- list ---------- */
main{flex:1 1 auto;position:relative;z-index:1;overflow:hidden}
#list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(16px + env(safe-area-inset-bottom))}
.spacer{position:relative;width:100%}
.row{
  position:absolute;left:0;right:0;height:80px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;
  overflow:hidden;
}
.row .bar{width:4px;align-self:stretch;flex:0 0 4px}
.row .num{
  flex:0 0 66px;text-align:center;font-variant-numeric:tabular-nums;
  font-size:25px;font-weight:750;line-height:1;letter-spacing:-.5px
}
.row .num small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.5px;margin-top:3px;opacity:.72}
.row .meta{flex:1 1 auto;min-width:0;padding-right:10px}
.row .nm{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dist{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;padding-right:6px;align-self:flex-start;margin-top:12px}
.row .fav{flex:0 0 34px;align-self:stretch;border:0;background:transparent;color:#cfccc4;font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.row .fav.on{color:#e3a008}
/* ---------- traffic ---------- */
#traf{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
body.tabtraf #list,body.tabtraf #map{display:none}
body.tabtraf .search,body.tabtraf .chips,body.tabtraf .banner{display:none}
body.tabtraf #traf{display:block}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.thead b{font-size:15px;font-weight:650}
.thead span{font-size:11.5px;color:var(--ink2)}
.tgall{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:9px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.tgall::-webkit-scrollbar{display:none}
.tc{flex:0 0 87%;scroll-snap-align:center;text-decoration:none;color:inherit;display:block}
.tc img{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#0c6b6b}
.tc span{display:block;font-size:11.5px;color:var(--ink2);margin-top:7px;line-height:1.35}
.tnote{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:12px}
.tnote b{color:var(--ink);font-weight:650}
.tnews{margin-top:18px}
#nlist{margin-top:9px}
.ni{display:flex;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:8px}
.ni .dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#c3c0b8;margin-top:6px}
.ni.live .dot{background:var(--bad)}
.ni .nt{font-size:12.5px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni.open .nt{display:block;-webkit-line-clamp:unset}
.ni{cursor:pointer}
.ni.live .nt{color:var(--ink)}
.v-ok{background:var(--ok)} .v-warn{background:var(--warn)} .v-bad{background:var(--bad)} .v-na{background:#b8b5ad}
.n-ok{color:var(--ok)} .n-warn{color:var(--warn)} .n-bad{color:var(--bad)} .n-na{color:#9a978f}
/* ---------- map ---------- */
#locate{position:absolute;right:12px;bottom:38px;z-index:400;width:46px;height:46px;border-radius:50%;border:1px solid #e2dfd8;background:#fff;color:#1a73e8;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none;place-items:center}
body.tabmap #locate{display:grid}
body.sheetopen #locate{display:none}
#attrib{position:absolute;right:8px;bottom:8px;z-index:400;font-size:9.5px;color:#4a4a4a;background:rgba(255,255,255,.78);padding:2px 5px;border-radius:4px;pointer-events:none;display:none}
body.tabmap #attrib{display:block}
#map{position:absolute;inset:0;display:none;background:#e9e7e1}
body.tabmap #list{display:none} body.tabmap #map{display:block}
.pin{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font:700 12px/1 system-ui;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45);
  border:3px solid #fff;font-variant-numeric:tabular-nums
}
.me{
  width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
  box-shadow:0 0 0 7px rgba(26,115,232,.22),0 1px 5px rgba(0,0,0,.45)
}
/* ---------- footer tabs ---------- */
footer{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff;
  padding-bottom:env(safe-area-inset-bottom);z-index:30
}
footer button{
  flex:1;border:0;background:none;padding:11px 0 12px;font:600 12.5px/1 inherit;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px
}
footer button.on{color:var(--accent)}
footer button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ---------- sheet ---------- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .24s ease;
  z-index:60;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:72dvh;overflow:auto
}
#sheet.open{transform:translateY(0)}
#s-close{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#f1efe9;color:#6b6e78;font-size:15px;display:grid;place-items:center}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:#dcd9d2;margin:2px auto 12px}
.dist-line{font-size:13px;color:#1a73e8;margin:-4px 0 12px;font-weight:650}
#s-trend{color:#5a5d66;font-weight:500;margin:-8px 0 12px}
#s-trend b.up{color:#12855a}
#s-trend b.down{color:#c0392b}
#s-trend b.flat{color:#5a5d66}
#sheet h2{font-size:17px;margin:0 0 4px;line-height:1.3}
#sheet .addr{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:#f1efe9;border-radius:7px;padding:5px 9px;font-size:12px;color:#3c3e45}
.big{display:flex;align-items:baseline;gap:6px;margin:6px 0 14px}
.big b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:12.5px;color:var(--ink2)}
.go{
  display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
  padding:13px;border-radius:11px;font-weight:650;font-size:15px;
  transition:background .15s,transform .12s,opacity .12s
}
.go:active{opacity:.8;transform:scale(.985)}
.go.alt-on{background:#1677ff}
.alt{display:block;text-align:center;font-size:12px;color:var(--ink2);margin-top:10px;text-decoration:underline}
.route-btn{
  display:block;width:100%;text-align:center;background:#fff;border:1.5px solid var(--accent);
  color:var(--accent);padding:11px;border-radius:11px;font-weight:650;font-size:14px;margin-top:9px;cursor:pointer
}
.route-btn:active{opacity:.75;transform:scale(.985)}
.route-btn:disabled{opacity:.5}
/* 地圖內路線摘要條 */
#routebar{
  position:absolute;top:10px;left:10px;right:10px;z-index:800;background:#fff;
  border-radius:13px;box-shadow:0 3px 16px rgba(0,0,0,.22);padding:11px 13px;
  font-size:13px;display:none
}
#routebar.show{display:block}
body:not(.tabmap) #routebar{display:none!important}
#routebar .rb-main{display:flex;align-items:center;gap:8px}
#routebar .rb-sum{font-weight:700;font-size:14px}
#routebar .rb-steps-btn{
  margin-left:auto;border:1px solid var(--line);background:#f1efe9;border-radius:8px;
  padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap
}
#routebar .rb-x{
  border:0;background:#f1efe9;width:26px;height:26px;border-radius:50%;color:var(--ink2);
  font-size:13px;display:grid;place-items:center;flex:0 0 26px
}
#steps{
  display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:7px;
  max-height:34dvh;overflow-y:auto;font-size:12.5px;color:var(--ink2);line-height:1.45
}
#steps .st{display:flex;gap:8px;padding:3.5px 0}
#steps .st b{
  flex:0 0 18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:10px;display:grid;place-items:center;margin-top:1px;font-weight:700
}
#steps .st span{flex:1}
button,.chip,.geo,#locate{transition:transform .12s,opacity .12s,background .15s,color .15s,border-color .15s}
button:active,.chip:active,.geo:active,#locate:active{opacity:.7}
.chip[aria-pressed="true"]:active{opacity:.85}
.hint{font-size:11.5px;color:var(--ink2);margin-top:10px;text-align:center}
#top{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));display:none;z-index:80}
.skel{padding:14px}
.skel div{height:80px;border-radius:13px;background:linear-gradient(90deg,#eeece7 25%,#f6f4ef 37%,#eeece7 63%);background-size:400% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{padding:40px 10px;text-align:center;color:var(--ink2);font-size:13.5px}
@media (prefers-color-scheme:dark){
  :root{--bg:#111214;--card:#1b1d21;--ink:#f2f1ee;--ink2:#9a9da6;--line:#2a2d33}
  .search input,.geo,.chip{background:#1b1d21;color:var(--ink)}
  .chip[aria-pressed="true"]{background:#f2f1ee;color:#111214;border-color:#f2f1ee}
  #sheet{background:#16181b}
  .tag{background:#24272c;color:#d6d5d1}
  footer{background:#16181b}
  .go{background:#f2f1ee;color:#111214}
  .route-btn{background:#1b1d21;border-color:#f2f1ee;color:#f2f1ee}
  #routebar{background:#1b1d21;border:1px solid #2a2d33}
  #routebar .rb-steps-btn,#routebar .rb-x{background:#24272c;color:#d6d5d1}
  .skel div{background:linear-gradient(90deg,#1e2126 25%,#262a30 37%,#1e2126 63%);background-size:400% 100%}
  #map{background:#1a1c20}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>香港泊車</h1>
    <div class="hsub" id="stamp">載入場地資料…</div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋停車場 / 地區 / 街道" autocomplete="off" enterkeyhint="search">
    <button class="geo" id="geo" aria-label="用我位置">◎</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="banner" id="banner" style="display:none;margin:0 0 9px">
    <span>◎</span><span>開定位，即刻睇你<b>附近邊個場有位</b></span>
    <button class="geo" id="bgeo" style="width:auto;flex:0 0 auto;padding:0 9px;height:30px;border-radius:8px;font-size:12px;background:#fff">開啟</button>
    <span class="x" id="bx">✕</span>
  </div>
</header>

<main>
  <div id="list"><div class="skel" id="skel"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div id="map"></div>
  <div id="attrib">© OpenStreetMap</div>
  <div id="routebar">
    <div class="rb-main">
      <span class="rb-sum" id="rb-sum">—</span>
      <button class="rb-steps-btn" id="rb-steps">轉彎指示</button>
      <button class="rb-x" id="rb-x" aria-label="清除路線">✕</button>
    </div>
    <div id="steps"></div>
  </div>
  <button id="locate" aria-label="返我位置">◎</button>
  <div id="traf">
    <div class="thead"><b>主要幹線塞車情況</b><span id="tstamp">載入中…</span></div>
    <div class="tgall" id="tgall">
      <a class="tc" href="https://resource.data.one.gov.hk/td/jss/sj1.tc.png" target="_blank" rel="noopener">
        <img data-n="1" alt="過海路線圖一" loading="lazy"><span>① 過海 · 九龍（中／西）· 荃灣</span></a>
      <a class="tc" href="https://resource.data.one.gov.hk/td/jss/sj2.tc.png" target="_blank" rel="noopener">
        <img data-n="2" alt="過海路線圖二" loading="lazy"><span>② 過海 · 九龍（東／中／西）</span></a>
      <a class="tc" href="https://resource.data.one.gov.hk/td/jss/sj3.tc.png" target="_blank" rel="noopener">
        <img data-n="3" alt="過海路線圖三" loading="lazy"><span>③ 過海 · 九龍（東／中／西）另一組入口</span></a>
      <a class="tc" href="https://resource.data.one.gov.hk/td/jss/sj4.tc.png" target="_blank" rel="noopener">
        <img data-n="4" alt="新界西路線圖" loading="lazy"><span>④ 新界西 · 汀九／屯門／機場</span></a>
      <a class="tc" href="https://resource.data.one.gov.hk/td/jss/sj5.tc.png" target="_blank" rel="noopener">
        <img data-n="5" alt="新界西路線圖二" loading="lazy"><span>⑤ 新界西 · 荃灣／深井／小欖</span></a>
    </div>
    <div class="tnote"><b>綠＝暢順，黃＝慢車</b>，格內數字係預計行車分鐘。呢啲係運輸署即時數據，約每 2 分鐘更新，撳圖可放大。<br>只覆蓋主要幹線同過海路線，唔係全港每條街。</div>
    <div class="tnews">
      <div class="thead"><b>特別交通消息</b><span id="nstamp">—</span></div>
      <div id="nlist"><div class="tnote">載入中…</div></div>
    </div>
  </div>
</main>

<footer>
  <button id="tablist" class="on" aria-label="列表">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>附近</span>
  </button>
  <button id="tabmap" aria-label="地圖">
    <svg viewBox="0 0 24 24"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg><span>地圖</span>
  </button>
  <button id="tabtraf" aria-label="塞車">
    <svg viewBox="0 0 24 24"><path d="M4 16h16M5.5 16v-4.5L7.5 7h9l2 4.5V16"/><circle cx="8" cy="18.5" r="1.3"/><circle cx="16" cy="18.5" r="1.3"/></svg><span>塞車</span>
  </button>
</footer>

<div id="sheet">
  <div class="grip"></div>
  <button id="s-close" aria-label="關閉">✕</button>
  <h2 id="s-name">—</h2>
  <div class="addr" id="s-addr">—</div>
  <div class="dist-line" id="s-dist" style="display:none"></div>
  <div class="dist-line" id="s-trend" style="display:none"></div>
  <div class="big"><b id="s-num">—</b><span id="s-unit">個私家車位</span></div>
  <div class="kv" id="s-kv"></div>
  <a class="go" id="s-go" href="#" target="_blank" rel="noopener">用 Maps 帶我去 →</a>
  <button class="route-btn" id="s-route">喺地圖畫路線（唔使開 Maps）→</button>
  <a class="alt" id="s-alt" href="#" target="_blank" rel="noopener"></a>
  <div class="hint" id="s-hint"></div>
</div>

<script>
(function(){
"use strict";
var VAC_URL="https://api.data.gov.hk/v1/carpark-info-vacancy?data=vacancy";
var INFO_URL="data/info.json";
var ROW=80, GAP=10, PER=ROW+GAP;
var REFRESH=90000;

var S={rows:[],view:[],q:"",dist:"",chips:{},me:null,sel:null,map:null,markers:null,lastFetch:0,tab:"list",first:{},favs:{},next:0,trafAt:0};
try{S.favs=JSON.parse(localStorage.getItem("hkp_favs")||"{}")||{}}catch(e){S.favs={}}
function saveFavs(){try{localStorage.setItem("hkp_favs",JSON.stringify(S.favs))}catch(e){}}
function toggleFav(id){
  var k=String(id);
  if(S.favs[k])delete S.favs[k]; else S.favs[k]=1;
  saveFavs(); apply();
}

/* ---------- utils ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dist(a,b,c,d){
  if(a==null||c==null)return null;
  var R=6371000,to=Math.PI/180;
  var dφ=(c-a)*to, dλ=(d-b)*to;
  var x=Math.sin(dφ/2)*Math.sin(dφ/2)+Math.cos(a*to)*Math.cos(c*to)*Math.sin(dλ/2)*Math.sin(dλ/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function fmtD(m){
  if(m==null)return"";
  if(m<1000)return Math.round(m/10)*10+" m";

function fetchVac(){
  if(document.hidden)return;
  var t=Date.now();
  if(t-S.lastFetch<5000)return;
  fetch(VAC_URL,{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    var m={},n=0,newest="";
    (j.results||[]).forEach(function(x){
      var pc=x.privateCar&&x.privateCar[0];
      if(!pc)return;
      m[String(x.park_Id)]={vt:pc.vacancy_type,num:typeof pc.vacancy==="number"?pc.vacancy:null,upd:pc.lastupdate||""};
      n++;
      if((pc.lastupdate||"")>newest)newest=pc.lastupdate;
    });
    S.rows.forEach(function(r){
      var v=m[String(r.id)];
      if(v){r.vt=v.vt;r.num=v.num;r.upd=v.upd}
      /* 記低呢個 session 第一次見到嘅車位數，做「前後對比」 */
      if(v&&typeof r.num==="number"&&r.num>=0&&!S.first[String(r.id)])
        S.first[String(r.id)]={num:r.num,ts:t};
    });
    S.lastFetch=t;
    S.next=t+REFRESH;
    $("stamp").innerHTML="實時更新 · "+ago(newest)+"<br>"+n+" 個場 · "+(S.me?"按距離":"空位最多優先")+
      ' · <span id="cd"></span>';
    apply();
    if(S.sel&&$("sheet").classList.contains("open"))paintTrend(S.sel);
  }).catch(function(){
    if(!S.lastFetch)$("stamp").textContent="場地資料已載入\n實時數據暫時攞唔到";
  });

function apply(){
  var q=S.q.trim().toLowerCase();
  var on=Object.keys(S.chips).filter(function(k){return S.chips[k]});
  var out=S.rows.filter(function(r){
    if(S.dist && r.d!==S.dist)return false;
    if(q && (r.n+" "+r.d+" "+r.a).toLowerCase().indexOf(q)<0)return false;
    for(var i=0;i<on.length;i++){
      var c=CHIPS.filter(function(x){return x.k===on[i]})[0];
      if(c&&!c.f(r))return false;
    }
    return true;
  });
  var favN=function(r){return S.favs[String(r.id)]?0:1};
  if(S.me){
    out.forEach(function(r){r._d=dist(S.me[0],S.me[1],r.lat,r.lng)});
    out.sort(function(a,b){
      var fa=favN(a),fb=favN(b);
      if(fa!==fb)return fa-fb;
      return (a._d==null?9e9:a._d)-(b._d==null?9e9:b._d)
    });
  }else{
    out.sort(function(a,b){
      var fa=favN(a),fb=favN(b);
      if(fa!==fb)return fa-fb;
      var la=lvl(a),lb=lvl(b),w={ok:0,warn:1,bad:2,na:3};
      if(w[a]!==w[b])return w[a]-w[b];
      return (b.num||0)-(a.num||0);
    });
  }
  S.view=out;
  var sk=$("skel"); if(sk) sk.style.display="none";
  if(!out.length){showEmpty("冇符合條件嘅停車場");return}
  render(true);
  if(S.map)drawPins();
}

function render(force){
  var n=S.view.length;

function inMainland(){

  }catch(e){}
  var l=(navigator.language||"").toLowerCase();

}
/* WGS-84 → GCJ-02（高德座標系），唔轉會偏移幾百米 */
function wgs2gcj(lat,lng){
  var a=6378245,ee=0.00669342162296594323;
  function out(l,h){return l<0.8293||l>55.8271||h<72.004||h>137.8347}
  function tLat(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
  function tLng(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*Math.PI*x))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
  if(out(lat,lng))return [lat,lng];
  var dLat=tLat(lng-105,lat),dLng=tLng(lng-105,lat);
  var rl=lat/180*Math.PI,mg=Math.sin(rl);mg=1-ee*mg*mg;var sm=Math.sqrt(mg);
  dLat=(dLat*180)/((a*(1-ee))/(mg*sm)*Math.PI);
  dLng=(dLng*180)/(a/sm*Math.cos(rl)*Math.PI);
  return [lat+dLat,lng+dLng];
}
function navLinks(r){
  var g="https://www.google.com/maps/dir/?api=1"+
    (S.me?"&origin="+S.me[0]+","+S.me[1]:"")+

  var c=wgs2gcj(r.lat,r.lng);
  var a="https://uri.amap.com/navigation?to="+c[1]+","+c[0]+","+encodeURIComponent(r.n)+
    "&mode=car&policy=1&src=hkparking&coordinate=gaode&callnative=1";

}

function clearRoute(){

function planRoute(r){

    S.pendingRoute=r;

  }

  fetch(OSRM+S.me[1]+","+S.me[0]+";"+r.lng+","+r.lat+
    "?overview=full&geometries=geojson&steps=true&alternatives=false",

  .then(function(x){return x.json()})
  .then(function(j){
    if(btn){btn.textContent="喺地圖畫路線（唔使開 Maps）";btn.disabled=false}
    if(!j.routes||!j.routes.length){showRouteMsg("路線服務暫時回應唔到，可以用導航掣開 Maps");return}
    var rt=j.routes[0],pts=rt.geometry.coordinates.map(function(c){return[c[1],c[0]]});

    }).join("");
    $("steps").style.display="none";
    $("routebar").classList.add("show");

      {paddingTopLeft:[24,84],paddingBottomRight:[24,24]});

    if(btn){btn.textContent="喺地圖畫路線（唔使開 Maps）";btn.disabled=false}
    showRouteMsg("路線服務連唔上（網絡問題），可以用導航掣開 Maps");
  });
}

  var el=$("s-trend");

  var ok=rec&&cur!=null;

  var mins=Math.max(1,Math.round((Date.now()-rec.ts)/60000));
  if(rec.num===cur){

    el.style.display="block";
    el.innerHTML=mins+" 分鐘前睇過，<b class=\"flat\">"+cur+" 個位冇變</b>";
    return;
  }
  var diff=cur-rec.num;
  var cls=diff>0?"up":"down";
  var word=diff>0?"+":"";
  el.style.display="block";
  el.innerHTML=mins+" 分鐘前 "+rec.num+" → 而家 <b class=\""+cls+"\">"+cur+
    "（"+word+diff+"）</b>"+(diff>0?" · 多咗位":" · 快手啲");

      zIndexOffset:2000,interactive:false
    }).addTo(S.map);
  }else S.meM.setLatLng(S.me);
}
function drawLine(r){
  if(!S.map)return;
  if(S.rLine)return; /* 已畫咗真路線，唔好再疊條直線虛線 */
  if(S.line){S.map.removeLayer(S.line);S.line=null}
  if(!S.me||!r)return;
  S.line=L.polyline([S.me,[r.lat,r.lng]],{color:"#1a73e8",weight:3.5,dashArray:"7 8",opacity:.85,interactive:false}).addTo(S.map);
}
function drawPins(){
  if(!S.map)return;
  var z=S.map.getZoom(), b=S.map.getBounds();
  S.markers.clearLayers();
  if(z<13){
    /* 遠景：像素網格聚合，避免幾百個標籤疊死 */
    var grid={},W=52,cap=0;
    for(var i=0;i<S.view.length;i++){
      var r=S.view[i];
      if(!b.contains([r.lat,r.lng]))continue;
      var p=S.map.latLngToContainerPoint([r.lat,r.lng]);
      var k=Math.floor(p.x/W)+"_"+Math.floor(p.y/W);
      var g=grid[k]||(grid[k]={n:0,free:0,c:0,lat:0,lng:0,ok:0});
      g.n++;g.c++;g.lat+=r.lat;g.lng+=r.lng;
      if(r.num!=null){g.free+=r.num;g.ok++}
    }
    Object.keys(grid).forEach(function(k){
      if(cap++>160)return;
      var g=grid[k];
      var lat=g.lat/g.c, lng=g.lng/g.c;
      var big=g.n>=12;
      var size=big?42:36;
      var l=g.ok&&g.free>0?"ok":(g.free===0&&g.ok?"bad":"na");
      var html='<div class="pin v-'+l+'" style="width:'+size+'px;height:'+size+'px;font-size:'+(big?13:12)+'px;border-width:2.5px">'+g.n+'</div>';
      var icon=L.divIcon({html:html,className:"",iconSize:[size,size],iconAnchor:[size/2,size/2]});
      L.marker([lat,lng],{icon:icon,keyboard:false})
        .on("click",function(){S.map.setView([lat,lng],14)})
        .addTo(S.markers);
    });
    return;
  }
  /* 近景：逐場顯示車位數 */
  var n=0;
  for(var j=0;j<S.view.length;j++){
    var r2=S.view[j];
    if(!b.contains([r2.lat,r2.lng]))continue;
    var lv=lvl(r2), txt=numText(r2);
    var sz=z>=15?38:32, fs=z>=15?13.5:12;
    var html2='<div class="pin v-'+lv+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+fs+'px">'+txt+'</div>';
    var ic=L.divIcon({html:html2,className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    var m=L.marker([r2.lat,r2.lng],{icon:ic,keyboard:false,title:r2.n});
    (function(rr){m.on("click",function(){open(S.view.indexOf(rr))})})(r2);
    S.markers.addLayer(m);
    if(++n>600)break;
  }
  if(n===0){
    /* 容器啱啱由 display:none 變返可見，bounds 可能未計好——重試一次 */
    setTimeout(function(){if(S.map){S.map.invalidateSize();drawPins()}},160);
  }
}

/* ---------- tabs ---------- */
function setTab(t){
  S.tab=t;
  document.body.classList.toggle("tabmap",t==="map");
  document.body.classList.toggle("tabtraf",t==="traf");
  $("tablist").classList.toggle("on",t==="list");
  $("tabmap").classList.toggle("on",t==="map");
  $("tabtraf").classList.toggle("on",t==="traf");
  var bn=$("banner");
  if(!bn.dataset.dismissed)bn.style.display = t==="list" ? "flex" : "none";
  if(t==="map"){
    loadLeaflet(function(){initMap();setTimeout(function(){S.map&&S.map.invalidateSize();drawPins()},60)});
  }else if(t==="traf"){
    loadTraf();
  }else{
    render(true);
  }
}
/* 運輸署主要幹線速度圖（自帶顏色＋行車分鐘） */
function loadTraf(){
  var t=Date.now();
  Array.prototype.forEach.call(document.querySelectorAll("#tgall img"),function(im){
    im.src="https://resource.data.one.gov.hk/td/jss/sj"+im.dataset.n+".tc.png?t="+t;
  });
  S.trafAt=t;
  var d=new Date(),p=function(n){return (n<10?"0":"")+n};
  $("tstamp").textContent="更新 "+p(d.getHours())+":"+p(d.getMinutes());
  loadNews();
}
function loadNews(){
  fetch("https://resource.data.one.gov.hk/td/tc/specialtrafficnews.xml",{cache:"no-store"})
  .then(function(r){return r.text()})
  .then(function(txt){
    var doc=new DOMParser().parseFromString(txt,"application/xml");
    var ms=doc.getElementsByTagName("message"),arr=[];
    for(var i=0;i<ms.length;i++){
      var g=function(n){var e=ms[i].getElementsByTagName(n)[0];return e?e.textContent:""};
      var body=(g("ChinShort")||g("ChinText")||"").replace(/\s+/g," ").trim();
      if(!body)continue;
      arr.push({id:parseInt(g("msgID"),10)||0,st:g("CurrentStatus"),txt:body});
    }
    arr.sort(function(a,b){
      var la=a.st==="2"?0:1, lb=b.st==="2"?0:1;
      return (la-lb)||(b.id-a.id);
    });
    var live=arr.filter(function(x){return x.st==="2"});
    var done=arr.filter(function(x){return x.st!=="2"});
    arr=live.slice(0,4).concat(done.slice(0,4));
    var box=$("nlist");
    if(!arr.length){box.innerHTML='<div class="tnote">而家冇特別交通消息</div>';return}
    box.innerHTML=arr.map(function(x){
      var live=x.st==="2";
      return '<div class="ni'+(live?" live":"")+'"><span class="dot"></span><div class="nt">'+
        (live?"":"<span style=\"opacity:.6\">已解封 · </span>")+esc(x.txt)+'</div></div>';
    }).join("");
    var d=new Date(),p=function(n){return (n<10?"0":"")+n};
    $("nstamp").textContent=arr.length+" 條 · "+p(d.getHours())+":"+p(d.getMinutes());
  })
  .catch(function(){$("nlist").innerHTML='<div class="tnote">交通消息暫時攞唔到（網絡問題）</div>'});
}
$("nlist").addEventListener("click",function(e){
  var ni=e.target.closest(".ni");
  if(ni)ni.classList.toggle("open");
});
setInterval(function(){
  var el=$("cd");
  if(el&&S.next){
    var s=Math.round((S.next-Date.now())/1000);
    el.textContent=s>0?(s+" 秒後更新"):"更新中…";
  }
  if(S.tab==="traf"&&S.trafAt&&Date.now()-S.trafAt>120000)loadTraf();
},1000);
$("tablist").onclick=function(){setTab("list")};
$("tabmap").onclick=function(){setTab("map")};
$("tabtraf").onclick=function(){setTab("traf")};

/* ---------- search / geo ---------- */
var qt=0;
$("q").addEventListener("input",function(){
  clearTimeout(qt);
  var v=this.value;
  qt=setTimeout(function(){S.q=v;apply()},140);
});
function askGeo(){
  if(!navigator.geolocation){$("stamp").textContent="此瀏覽器不支援定位";return}
  $("geo").textContent="…";
  $("bgeo").textContent="…";
  navigator.geolocation.getCurrentPosition(function(p){
    S.me=[p.coords.latitude,p.coords.longitude];
    $("geo").textContent="●";
    $("geo").style.color="var(--ok)";
    $("banner").style.display="none";$("banner").dataset.dismissed="1";
    if(S.dist){S.dist="";distEl.value="";distEl.classList.remove("on")}
    apply();
    if(S.map){addMe();drawLine(S.sel);S.map.setView(S.me,15)}
    if(S.pendingRoute){var pr=S.pendingRoute;S.pendingRoute=null;planRoute(pr)}
    $("stamp").innerHTML="已按你位置排序<br>實時車位每 90 秒更新";
  },function(){
    $("geo").textContent="◎";
    $("bgeo").textContent="開啟";
    $("banner").style.display="none";$("banner").dataset.dismissed="1";
    try{localStorage.setItem("hkp_geooff","1")}catch(e){}
    $("stamp").innerHTML="未開啟定位<br>可用地區篩選";
  },{timeout:9000,maximumAge:120000});
}
$("geo").onclick=askGeo;
$("locate").onclick=function(){
  if(S.me&&S.map){addMe();S.map.setView(S.me,15,{animate:true})}
  else askGeo();
};
$("bgeo").onclick=askGeo;
$("bx").onclick=function(){
  $("banner").style.display="none";$("banner").dataset.dismissed="1";
  try{localStorage.setItem("hkp_geooff","1")}catch(e){}
};

/* ---------- boot ---------- */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)fetchVac();
});
setInterval(fetchVac,REFRESH);
loadInfo();
try{
  if(localStorage.getItem("hkp_geooff")){$("banner").dataset.dismissed="1"}
  else{$("banner").style.display="flex"}
}catch(e){}

// 壓測模式：?stress=3000 覆製樣本
var mq=/[?&]stress=(\d+)/.exec(location.search);
if(mq){/* 由 console 用 __stress() 觸發，避免正常用戶誤開 */}
window.__stress=function(k){
  var base=S.rows.slice(0,Math.min(60,S.rows.length));
  var out=[];
  for(var i=0;i<k;i++){
    var t=Object.assign({},base[i%base.length]);
    t.id="s"+i;t.n=t.n+" #"+i;t.lat=t.lat+(i%40)*0.001;t.lng=t.lng+(i%37)*0.001;
    out.push(t);
  }
  S.rows=out;S.me=null;apply();
  return out.length;
};
})();
</script>
