<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta name="description" content="全港停車場實時車位｜591 個場、每 90 秒更新">
<title>香港泊車 · 實時車位</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="香港泊車">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Ctext x='32' y='45' font-size='36' font-family='system-ui' font-weight='700' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --ink:#15161a; --ink2:#6b6e78; --line:#e6e3dc;
  --ok:#12855a; --warn:#c97a06; --bad:#c0392b; --accent:#15161a;
  --hdr:104px; --foot:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;
}
/* ---------- header ---------- */
header{padding:calc(8px + env(safe-area-inset-top)) 14px 0;flex:0 0 auto;background:var(--bg);z-index:30}
.hrow{display:flex;align-items:baseline;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:700}
.hsub{font-size:11.5px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.3}
.search{display:flex;gap:8px;margin:9px 0 8px;position:relative}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:75;display:none;overflow:hidden}
#sugg .sg{display:block;width:100%;text-align:left;padding:10px 13px;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.4}
#sugg .sg small{display:block;color:var(--ink2);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg .sg+.sg{border-top:1px solid var(--line)}
#sugg .hd{padding:6px 13px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--line);background:rgba(127,127,127,.06)}
#destbar{display:none;align-items:center;gap:8px;margin:-2px 0 8px;padding:8px 12px;border-radius:11px;background:rgba(26,115,232,.1);border:1px solid rgba(26,115,232,.4);font-size:12.5px;color:var(--ink)}
#destbar b{color:#1a73e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
#destbar .x{margin-left:auto;cursor:pointer;color:var(--ink2);padding:2px 6px;font-size:14px}
.hist{font-size:12.5px;color:var(--ink2);margin:-4px 0 12px;line-height:1.5}
.hist b{color:var(--ink);font-weight:650}
.search input{
  flex:1;min-width:0;height:38px;border:1px solid var(--line);background:#fff;
  border-radius:11px;padding:0 12px;font-size:15px;color:var(--ink);outline:none;
}
.search input:focus{border-color:#b9b6ae}
.geo{
  width:38px;height:38px;flex:0 0 38px;border:1px solid var(--line);background:#fff;
  border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--ink2)
}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 9px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:999px;padding:6px 12px;font-size:13px;line-height:1;white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select.chip{
  -webkit-appearance:none;appearance:none;padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,#9a978f 50%),linear-gradient(135deg,#9a978f 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-top:7px;padding-bottom:7px
}
select.chip.on{background-color:var(--accent);border-color:var(--accent);color:#fff}
.banner{
  display:flex;align-items:center;gap:9px;background:#eef4ff;border:1px solid #d7e3fa;color:#1c4b8f;
  border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.35
}
.banner b{font-weight:650}
.banner .x{margin-left:auto;color:#5a7bb0;font-size:16px;padding:0 2px}
/* ---------- list ---------- */
main{flex:1 1 auto;position:relative;z-index:1;overflow:hidden}
#list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(16px + env(safe-area-inset-bottom))}
.spacer{position:relative;width:100%}
.row{
  position:absolute;left:0;right:0;height:80px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;
  overflow:hidden;
}
.row .bar{width:4px;align-self:stretch;flex:0 0 4px}
.row .num{
  flex:0 0 66px;text-align:center;font-variant-numeric:tabular-nums;
  font-size:25px;font-weight:750;line-height:1;letter-spacing:-.5px
}
.row .num small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.5px;margin-top:3px;opacity:.72}
.row .meta{flex:1 1 auto;min-width:0;padding-right:10px}
.row .nm{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dist{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;padding-right:6px;align-self:flex-start;margin-top:12px}
.row .fav{flex:0 0 34px;align-self:stretch;border:0;background:transparent;color:#cfccc4;font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.row .fav.on{color:#e3a008}
/* ---------- traffic ---------- */
#traf{position:absolute;inset:0;display:none;overflow:hidden}
body.tabtraf #list,body.tabtraf #map{display:none}
body.tabtraf .search,body.tabtraf .chips,body.tabtraf .banner{display:none}
body.tabtraf #traf{display:block}
#tmap{position:absolute;inset:0;background:#e9e7e1}
#tstamp{
  position:absolute;left:10px;top:10px;z-index:520;background:rgba(255,255,255,.95);
  border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--ink);
  box-shadow:0 1px 6px rgba(0,0,0,.18);line-height:1.35;max-width:calc(100% - 20px)
}
#tstamp b{font-weight:700}
#tlegend{
  position:absolute;left:10px;bottom:14px;z-index:520;background:rgba(255,255,255,.95);
  border-radius:11px;padding:8px 11px;font-size:11.5px;color:var(--ink);
  box-shadow:0 1px 6px rgba(0,0,0,.18);line-height:1.6
}
#tlegend .lg{display:flex;align-items:center;gap:6px}
#tlegend i{width:11px;height:11px;border-radius:50%;display:inline-block}
#tlegend .note{color:var(--ink2);font-size:10.5px;margin-top:3px;line-height:1.4}
#tnews-btn{
  position:absolute;right:10px;bottom:14px;z-index:520;border:1px solid var(--line);
  background:rgba(255,255,255,.96);border-radius:11px;padding:9px 12px;font-size:12px;
  font-weight:650;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.18);
  display:flex;align-items:center;gap:6px
}
#tnews-btn .nd{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block}
#tnews-btn .nd.off{background:#c3c0b8}
#tnews-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:620;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -6px 26px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .22s ease;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:60dvh;overflow:auto;display:none
}
#tnews-panel.show{display:block}
#tnews-panel.open{transform:translateY(0)}
#tnews-panel .grip{width:38px;height:4px;border-radius:2px;background:#dcd9d2;margin:2px auto 10px}
#tnews-panel h3{font-size:15px;margin:0 0 8px;font-weight:700}
#nlist{margin-top:2px}
#nlist .tnote{font-size:12px;color:var(--ink2);padding:6px 2px;line-height:1.5}
.ni{display:flex;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:8px}
.ni .dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#c3c0b8;margin-top:6px}
.ni.live .dot{background:var(--bad)}
.ni .nt{font-size:12.5px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni.open .nt{display:block;-webkit-line-clamp:unset}
.ni{cursor:pointer}
.ni.live .nt{color:var(--ink)}
.v-ok{background:var(--ok)} .v-warn{background:var(--warn)} .v-bad{background:var(--bad)} .v-na{background:#b8b5ad}
.n-ok{color:var(--ok)} .n-warn{color:var(--warn)} .n-bad{color:var(--bad)} .n-na{color:#9a978f}
/* ---------- map ---------- */
#locate{position:absolute;right:12px;bottom:38px;z-index:400;width:46px;height:46px;border-radius:50%;border:1px solid #e2dfd8;background:#fff;color:#1a73e8;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none;place-items:center}
body.tabmap #locate{display:grid}
body.sheetopen #locate{display:none}
#attrib{position:absolute;right:8px;bottom:8px;z-index:400;font-size:9.5px;color:#4a4a4a;background:rgba(255,255,255,.78);padding:2px 5px;border-radius:4px;pointer-events:none;display:none}
body.tabmap #attrib{display:block}
#map{position:absolute;inset:0;display:none;background:#e9e7e1}
body.tabmap #list{display:none} body.tabmap #map{display:block}
.pin{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font:700 12px/1 system-ui;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45);
  border:3px solid #fff;font-variant-numeric:tabular-nums
}
.me{
  width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
  box-shadow:0 0 0 7px rgba(26,115,232,.22),0 1px 5px rgba(0,0,0,.45)
}
/* ---------- footer tabs ---------- */
footer{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff;
  padding-bottom:env(safe-area-inset-bottom);z-index:30
}
footer button{
  flex:1;border:0;background:none;padding:11px 0 12px;font:600 12.5px/1 inherit;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px
}
footer button.on{color:var(--accent)}
footer button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ---------- sheet ---------- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .24s ease;
  z-index:60;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:72dvh;overflow:auto
}
#sheet.open{transform:translateY(0)}
#s-close{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#f1efe9;color:#6b6e78;font-size:15px;display:grid;place-items:center}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:#dcd9d2;margin:2px auto 12px}
.dist-line{font-size:13px;color:#1a73e8;margin:-4px 0 12px;font-weight:650}
#s-trend{color:#5a5d66;font-weight:500;margin:-8px 0 12px}
#s-trend b.up{color:#12855a}
#s-trend b.down{color:#c0392b}
#s-trend b.flat{color:#5a5d66}
#sheet h2{font-size:17px;margin:0 0 4px;line-height:1.3}
#sheet .addr{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:#f1efe9;border-radius:7px;padding:5px 9px;font-size:12px;color:#3c3e45}
.big{display:flex;align-items:baseline;gap:6px;margin:6px 0 14px}
.big b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:12.5px;color:var(--ink2)}
.go{
  display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
  padding:13px;border-radius:11px;font-weight:650;font-size:15px;
  transition:background .15s,transform .12s,opacity .12s
}
.go:active{opacity:.8;transform:scale(.985)}
.go.alt-on{background:#1677ff}
.alt{display:block;text-align:center;font-size:12px;color:var(--ink2);margin-top:10px;text-decoration:underline}
.route-btn{
  display:block;width:100%;text-align:center;background:#fff;border:1.5px solid var(--accent);
  color:var(--accent);padding:11px;border-radius:11px;font-weight:650;font-size:14px;margin-top:9px;cursor:pointer
}
.route-btn:active{opacity:.75;transform:scale(.985)}
.route-btn:disabled{opacity:.5}
/* 地圖內路線摘要條 */
#routebar{
  position:absolute;top:10px;left:10px;right:10px;z-index:800;background:#fff;
  border-radius:13px;box-shadow:0 3px 16px rgba(0,0,0,.22);padding:11px 13px;
  font-size:13px;display:none
}
#routebar.show{display:block}
body:not(.tabmap) #routebar{display:none!important}
#routebar .rb-main{display:flex;align-items:center;gap:8px}
#routebar .rb-sum{font-weight:700;font-size:14px}
#routebar .rb-steps-btn{
  margin-left:auto;border:1px solid var(--line);background:#f1efe9;border-radius:8px;
  padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap
}
#routebar .rb-x{
  border:0;background:#f1efe9;width:26px;height:26px;border-radius:50%;color:var(--ink2);
  font-size:13px;display:grid;place-items:center;flex:0 0 26px
}
#steps{
  display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:7px;
  max-height:34dvh;overflow-y:auto;font-size:12.5px;color:var(--ink2);line-height:1.45
}
#steps .st{display:flex;gap:8px;padding:3.5px 0}
#steps .st b{
  flex:0 0 18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:10px;display:grid;place-items:center;margin-top:1px;font-weight:700
}
#steps .st span{flex:1}
button,.chip,.geo,#locate{transition:transform .12s,opacity .12s,background .15s,color .15s,border-color .15s}
button:active,.chip:active,.geo:active,#locate:active{opacity:.7}
.chip[aria-pressed="true"]:active{opacity:.85}
.hint{font-size:11.5px;color:var(--ink2);margin-top:10px;text-align:center}
#top{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));display:none;z-index:80}
.skel{padding:14px}
.skel div{height:80px;border-radius:13px;background:linear-gradient(90deg,#eeece7 25%,#f6f4ef 37%,#eeece7 63%);background-size:400% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{padding:40px 10px;text-align:center;color:var(--ink2);font-size:13.5px}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1012;--card:#1a1d21;--ink:#f4f3f0;--ink2:#a9adb6;--line:#34383f}
  .search input,.geo,.chip,#locate{
    background:#262a31;border-color:#3d424a;color:var(--ink)
  }
  .search input:focus{border-color:#6f7681}
  .chip[aria-pressed="true"]{background:#f4f3f0;color:#111214;border-color:#f4f3f0}
  select.chip{background-image:linear-gradient(45deg,transparent 50%,#8f949e 50%),linear-gradient(135deg,#8f949e 50%,transparent 50%)}
  #sheet{background:#1a1d21;border-top:1px solid #34383f}
  #s-close{background:#2a2e36;color:#d6d5d1}
  .tag{background:#2a2e36;color:#e2e0da}
  footer{background:#191c20;border-top-color:#34383f}
  footer button{color:#a9adb6}
  footer button.on{color:#f4f3f0}
  .go{background:#f4f3f0;color:#111214}
  .route-btn{background:#262a31;border-color:#8f949e;color:#fff}
  #routebar{background:#23262c;border:1px solid #3d424a}
  #routebar .rb-steps-btn,#routebar .rb-x{background:#31353d;color:#e2e0da}
  #steps{border-top-color:#3d424a}
  #tstamp,#tlegend,#tnews-btn{
    background:rgba(26,29,33,.95);border:1px solid #3d424a;color:#f4f3f0;
    box-shadow:0 1px 8px rgba(0,0,0,.5)
  }
  #tlegend .note{color:#a9adb6}
  #tnews-panel{background:#1a1d21}
  #tnews-panel h3{color:#f4f3f0}
  .banner{background:#1b2739;border-color:#2f4568;color:#c2d4f2}
  .banner .x{color:#8fa9cf}
  #bgeo{background:#262a31!important;color:#f4f3f0!important;border:1px solid #3d424a!important}
  .skel div{background:linear-gradient(90deg,#1e2126 25%,#262a30 37%,#1e2126 63%);background-size:400% 100%}
  #map,#tmap{background:#1a1c20}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#23262c;color:#f4f3f0}
  .leaflet-container a.leaflet-popup-close-button{color:#a9adb6}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>香港泊車</h1>
    <div class="hsub" id="stamp">載入場地資料…</div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋車場 / 地區，或輸入目的地" autocomplete="off" enterkeyhint="search">
    <button class="geo" id="geo" aria-label="用我位置">◎</button>
    <div id="sugg"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="destbar"><span>🚩 由</span><b id="dest-name"></b><span>附近搵位</span><span class="x" id="dest-x" aria-label="清除目的地">✕</span></div>
  <div class="banner" id="banner" style="display:none;margin:0 0 9px">
    <span>◎</span><span>開定位，即刻睇你<b>附近邊個場有位</b></span>
    <button class="geo" id="bgeo" style="width:auto;flex:0 0 auto;padding:0 9px;height:30px;border-radius:8px;font-size:12px;background:#fff">開啟</button>
    <span class="x" id="bx">✕</span>
  </div>
</header>

<main>
  <div id="list"><div class="skel" id="skel"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div id="map"></div>
  <div id="attrib">© OpenStreetMap</div>
  <div id="routebar">
    <div class="rb-main">
      <span class="rb-sum" id="rb-sum">—</span>
      <button class="rb-steps-btn" id="rb-steps">轉彎指示</button>
      <button class="rb-x" id="rb-x" aria-label="清除路線">✕</button>
    </div>
    <div id="steps"></div>
  </div>
  <button id="locate" aria-label="返我位置">◎</button>
  <div id="traf">
    <div id="tmap"></div>
    <div id="tstamp">路況載入中…</div>
    <div id="tlegend">
      <div class="lg"><i style="background:#8e1b12"></i>嚴重（&lt;15 km/h）</div>
      <div class="lg"><i style="background:#d93025"></i>擠塞（15–30）</div>
      <div class="lg"><i style="background:#f4a300"></i>慢車（30–45）</div>
      <div class="lg"><i style="background:#12855a"></i>暢順（≥45）</div>
      <div class="note">運輸署主要幹道探測器<br>每 2 分鐘更新</div>
    </div>
    <button id="tnews-btn"><span class="nd off" id="tnews-dot"></span>交通消息 <span id="tnews-n">—</span></button>
  </div>
</main>

<footer>
  <button id="tablist" class="on" aria-label="列表">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>附近</span>
  </button>
  <button id="tabmap" aria-label="地圖">
    <svg viewBox="0 0 24 24"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg><span>地圖</span>
  </button>
  <button id="tabtraf" aria-label="塞車">
    <svg viewBox="0 0 24 24"><path d="M4 16h16M5.5 16v-4.5L7.5 7h9l2 4.5V16"/><circle cx="8" cy="18.5" r="1.3"/><circle cx="16" cy="18.5" r="1.3"/></svg><span>塞車</span>
  </button>
</footer>

<div id="sheet">
  <div class="grip"></div>
  <button id="s-close" aria-label="關閉">✕</button>

  <div class="addr" id="s-addr">—</div>

  <div class="grip"></div>
  <h3>特別交通消息 <span id="nstamp" style="font-size:11px;color:var(--ink2);font-weight:500;margin-left:4px"></span></h3>
  <div id="nlist"><div class="tnote" style="font-size:12px;color:var(--ink2)">載入中…</div></div>
</div>

<script>
(function(){
"use strict";
var VAC_URL="https://api.data.gov.hk/v1/carpark-info-vacancy?data=vacancy";
var INFO_URL="data/info.json";
var ROW=80, GAP=10, PER=ROW+GAP;
var REFRESH=90000;

var S={rows:[],view:[],q:"",dist:"",chips:{},me:null,sel:null,map:null,markers:null,lastFetch:0,tab:"list",first:{},favs:{},next:0,trafAt:0,dest:null,prof:null,profTried:false,destM:null};
try{S.favs=JSON.parse(localStorage.getItem("hkp_favs")||"{}")||{}}catch(e){S.favs={}}
function saveFavs(){try{localStorage.setItem("hkp_favs",JSON.stringify(S.favs))}catch(e){}}
function toggleFav(id){
  var k=String(id);
  if(S.favs[k])delete S.favs[k]; else S.favs[k]=1;
  saveFavs(); apply();
}

/* ---------- utils ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dist(a,b,c,d){
  if(a==null||c==null)return null;
  var R=6371000,to=Math.PI/180;
  var dφ=(c-a)*to, dλ=(d-b)*to;
  var x=Math.sin(dφ/2)*Math.sin(dφ/2)+Math.cos(a*to)*Math.cos(c*to)*Math.sin(dλ/2)*Math.sin(dλ/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function fmtD(m){
  if(m==null)return"";
  if(m<1000)return Math.round(m/10)*10+" m";
  return (m/1000).toFixed(m<10000?1:0)+" km";
}
function ago(ts){
  if(!ts)return"";
  var t=Date.parse(ts.replace(/-/g,"/"));
  if(isNaN(t))return"";
  var m=Math.round((Date.now()-t)/60000);
  if(m<1)return"剛剛";
  if(m<60)return m+" 分鐘前";
  return Math.round(m/60)+" 小時前";
}
function lvl(r){
  if(r.vt==="C")return"bad";
  if(r.num==null||r.num<0)return r.vt==="B"?"ok":"na";
  if(r.num<=3)return"bad";
  if(r.num<=15)return"warn";
  return"ok";
}
function numText(r){
  if(r.vt==="C")return"關";
  if(r.num!=null&&r.num>=0)return r.num;
  if(r.vt==="B")return"有";
  return"—";
}
function unitText(r){
  if(r.vt==="C")return"暫停開放";
  if(r.num!=null&&r.num>=0)return"個車位";
  if(r.vt==="B")return"有位";
  return"無數據";
}

/* ---------- filters ---------- */
var CHIPS=[
  {k:"fav",t:"★ 收藏",f:function(r){return !!S.favs[String(r.id)]}},
  {k:"free",t:"有位",f:function(r){return r.vt!=="C"&&(r.num==null?r.vt==="B":r.num>0)}},
  {k:"num",t:"有數字",f:function(r){return r.num!=null}},
  {k:"price",t:"有時租",f:function(r){return r.p!=null}},
  {k:"tall",t:"高過 2 米",f:function(r){return r.h!=null&&r.h>=2}},
  {k:"ev",t:"有充電",f:function(r){return (r.f||[]).indexOf("EV")>=0}}
];
var distEl=null;
(function buildChips(){
  var box=$("chips");
  distEl=document.createElement("select");
  distEl.className="chip";
  distEl.setAttribute("aria-label","地區");
  box.appendChild(distEl);
  distEl.onchange=function(){S.dist=this.value;this.classList.toggle("on",!!this.value);apply()};
  CHIPS.forEach(function(c){
    var b=document.createElement("button");
    b.className="chip";b.textContent=c.t;b.setAttribute("aria-pressed","false");
    b.onclick=function(){
      S.chips[c.k]=!S.chips[c.k];
      b.setAttribute("aria-pressed",S.chips[c.k]?"true":"false");
      apply();
    };
    box.appendChild(b);
  });
})();
function fillDistricts(list){
  if(!distEl||distEl.dataset.ok)return;
  var opt=document.createElement("option");
  opt.value="";opt.textContent="全部地區";
  distEl.appendChild(opt);
  list.forEach(function(d){
    var o=document.createElement("option");o.value=d;o.textContent=d;distEl.appendChild(o);
  });
  distEl.dataset.ok="1";
}

/* ---------- data ---------- */
function loadInfo(){
  var cached=null;
  try{
    var raw=localStorage.getItem("hkp_info");
    if(raw)cached=JSON.parse(raw);
  }catch(e){}
  if(cached&&cached.rows&&cached.rows.length){
    S.rows=cached.rows; apply(); fetchVac();
  }
  fetch(INFO_URL,{cache:"no-cache"}).then(function(r){return r.json()}).then(function(j){
    if(!j.rows)return;
    S.rows=j.rows.filter(function(r){return r.lat&&r.lng});
    fillDistricts(j.districts||[]);
    try{localStorage.setItem("hkp_info",JSON.stringify({v:j.count,rows:S.rows}))}catch(e){}
    apply(); fetchVac();
  }).catch(function(){
    if(!S.rows.length) showEmpty("數據載入失敗，請檢查網絡後重試");
  });
}

function fetchVac(){
  if(document.hidden)return;
  var t=Date.now();
  if(t-S.lastFetch<5000)return;
  fetch(VAC_URL,{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    var m={},n=0,newest="";
    (j.results||[]).forEach(function(x){
      var pc=x.privateCar&&x.privateCar[0];
      if(!pc)return;
      m[String(x.park_Id)]={vt:pc.vacancy_type,num:typeof pc.vacancy==="number"?pc.vacancy:null,upd:pc.lastupdate||""};
      n++;
      if((pc.lastupdate||"")>newest)newest=pc.lastupdate;
    });
    S.rows.forEach(function(r){
      var v=m[String(r.id)];
      if(v){r.vt=v.vt;r.num=v.num;r.upd=v.upd}
      /* 記低呢個 session 第一次見到嘅車位數，做「前後對比」 */
      if(v&&typeof r.num==="number"&&r.num>=0&&!S.first[String(r.id)])
        S.first[String(r.id)]={num:r.num,ts:t};
    });
    S.lastFetch=t;
    S.next=t+REFRESH;
    $("stamp").innerHTML="實時更新 · "+ago(newest)+"<br>"+n+" 個場 · "+(S.me?"按距離":"空位最多優先")+
      ' · <span id="cd"></span>';
    apply();
    if(S.sel&&$("sheet").classList.contains("open"))paintTrend(S.sel);
  }).catch(function(){
    if(!S.lastFetch)$("stamp").textContent="場地資料已載入\n實時數據暫時攞唔到";
  });
}

function apply(){
  var q=S.q.trim().toLowerCase();
  var on=Object.keys(S.chips).filter(function(k){return S.chips[k]});
  var out=S.rows.filter(function(r){
    if(S.dist && r.d!==S.dist)return false;
    if(q && (r.n+" "+r.d+" "+r.a).toLowerCase().indexOf(q)<0)return false;
    for(var i=0;i<on.length;i++){
      var c=CHIPS.filter(function(x){return x.k===on[i]})[0];
      if(c&&!c.f(r))return false;
    }
    return true;
  });
  var favN=function(r){return S.favs[String(r.id)]?0:1};
  /* 距離基準：有目的地用目的地，否則用自己位置 */
  var ref=S.dest||S.me;
  if(ref){
    out.forEach(function(r){r._d=dist(ref[0],ref[1],r.lat,r.lng)});
    out.sort(function(a,b){
      var fa=favN(a),fb=favN(b);
      if(fa!==fb)return fa-fb;
      return (a._d==null?9e9:a._d)-(b._d==null?9e9:b._d)
    });
  }else{
    out.sort(function(a,b){
      var fa=favN(a),fb=favN(b);
      if(fa!==fb)return fa-fb;
      var la=lvl(a),lb=lvl(b),w={ok:0,warn:1,bad:2,na:3};
      if(w[a]!==w[b])return w[a]-w[b];
      return (b.num||0)-(a.num||0);
    });
  }
  S.view=out;
  var sk=$("skel"); if(sk) sk.style.display="none";
  if(!out.length){showEmpty("冇符合條件嘅停車場");return}
  render(true);
  if(S.map)drawPins();
}

function showEmpty(t){
  var l=$("list");
  l.innerHTML='<div class="empty">'+esc(t)+'</div>';
  spacer=null;pool={};lastTop=-1;
}

/* ---------- virtual list ---------- */
var listEl=$("list"), spacer=null, pool={}, lastTop=-1;

function ensureSpacer(n){
  if(!spacer||!spacer.isConnected){
    listEl.innerHTML="";
    spacer=document.createElement("div");
    spacer.className="spacer";
    listEl.appendChild(spacer);
    pool={};
  }
  spacer.style.height=(n*PER)+"px";
}
function rowHTML(r){
  var l=lvl(r);
  var bits=[];
  if(r.h!=null)bits.push("限高 "+r.h+"m");
  if(r.p!=null)bits.push("$"+r.p+"/小時起");
  if((r.f||[]).indexOf("EV")>=0)bits.push("EV");
  var d=r._d!=null?fmtD(r._d):"";
  return '<div class="bar v-'+l+'"></div>'+
    '<div class="num n-'+l+'">'+numText(r)+'<small>'+unitText(r)+'</small></div>'+
    '<div class="meta"><div class="nm">'+esc(r.n)+'</div>'+
    '<div class="sub">'+esc(r.d)+(bits.length?" · "+esc(bits.join(" · ")):"")+'</div></div>'+
    (d?'<div class="dist">'+d+'</div>':'')+
    '<button class="fav'+(S.favs[String(r.id)]?" on":"")+'" data-fav="'+r.id+'" aria-label="收藏">'+
      (S.favs[String(r.id)]?"★":"☆")+'</button>';
}
function render(force){
  var n=S.view.length;
  ensureSpacer(n);
  var top=listEl.scrollTop;
  if(!force&&Math.abs(top-lastTop)<PER*2)return;
  lastTop=top;
  var h=listEl.clientHeight||600;
  var first=Math.max(0,Math.floor(top/PER)-3);
  var last=Math.min(n-1,Math.floor((top+h)/PER)+3);
  var seen={};
  for(var i=first;i<=last;i++){
    var r=S.view[i], el=pool[i];
    if(!el){
      el=document.createElement("div");
      el.className="row";
      el.style.top=(i*PER)+"px";
      el.dataset.i=i;
      spacer.appendChild(el);
      pool[i]=el;
    }
    el.innerHTML=rowHTML(r);
    seen[i]=1;
  }
  Object.keys(pool).forEach(function(k){
    if(!seen[k]){pool[k].remove();delete pool[k]}
  });
}
listEl.addEventListener("scroll",function(){
  if(rAF)return;
  rAF=requestAnimationFrame(function(){rAF=0;render(false)});
},{passive:true});
var rAF=0;

listEl.addEventListener("click",function(e){
  var f=e.target.closest(".fav");
  if(f){e.stopPropagation();toggleFav(f.dataset.fav);return}
  var row=e.target.closest(".row");
  if(!row)return;
  open(parseInt(row.dataset.i,10));
});

/* ---------- 導航：香港用 Google、大陸用高德 ---------- */
var NAV={app:null};
function inMainland(){
  try{
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(tz==="Asia/Shanghai"||tz==="Asia/Urumqi")return true;
    if(tz==="Asia/Hong_Kong"||tz==="Asia/Macau"||tz==="Asia/Taipei")return false;
  }catch(e){}
  var l=(navigator.language||"").toLowerCase();
  return l.indexOf("zh-cn")===0||l==="zh"||l.indexOf("-cn")>0;
}
/* WGS-84 → GCJ-02（高德座標系），唔轉會偏移幾百米 */
function wgs2gcj(lat,lng){
  var a=6378245,ee=0.00669342162296594323;
  function out(l,h){return l<0.8293||l>55.8271||h<72.004||h>137.8347}
  function tLat(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
  function tLng(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*Math.PI*x))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
  if(out(lat,lng))return [lat,lng];
  var dLat=tLat(lng-105,lat),dLng=tLng(lng-105,lat);
  var rl=lat/180*Math.PI,mg=Math.sin(rl);mg=1-ee*mg*mg;var sm=Math.sqrt(mg);
  dLat=(dLat*180)/((a*(1-ee))/(mg*sm)*Math.PI);
  dLng=(dLng*180)/(a/sm*Math.cos(rl)*Math.PI);
  return [lat+dLat,lng+dLng];
}
function navLinks(r){
  var g="https://www.google.com/maps/dir/?api=1"+
    (S.me?"&origin="+S.me[0]+","+S.me[1]:"")+
    "&destination="+r.lat+","+r.lng+"&travelmode=driving";
  var c=wgs2gcj(r.lat,r.lng);
  var a="https://uri.amap.com/navigation?to="+c[1]+","+c[0]+","+encodeURIComponent(r.n)+
    "&mode=car&policy=1&src=hkparking&coordinate=gaode&callnative=1";
  return {g:g,a:a};
}

/* ---------- 地圖內路線（OSRM 開放路線服務，免 key，唔使開 Google／高德） ---------- */
var OSRM="https://router.project-osrm.org/route/v1/driving/";
var MAN={depart:"出發",arrive:"抵達目的地","new name":"直行",merge:"匯入",
  "on ramp":"駛入支路","off ramp":"駛出支路",fork:"行分岔","end of road":"去到路口",
  roundabout:"入迴旋處","roundabout turn":"行迴旋處",exit:"出迴旋處",continue:"繼續直行"};
var MOD={left:"左轉",right:"右轉","slight left":"稍向左","slight right":"稍向右",
  "sharp left":"急轉左","sharp right":"急轉右",straight:"直行",uturn:"掉頭"};
function stepText(st){
  var mv=st.maneuver||{},t=mv.type||"";
  var s=(t==="turn"||t==="fork"||t==="end of road")?(MOD[mv.modifier]||"轉彎"):(MAN[t]||MOD[mv.modifier]||"直行");
  var nm=st.name||"";
  if(nm)s+=" · "+nm;
  if(st.distance>15)s+="（行 "+fmtD(st.distance)+"）";
  return s;
}
function showRouteMsg(t){
  $("rb-sum").textContent=t;
  $("rb-steps").style.display="none";
  $("steps").style.display="none";
  $("routebar").classList.add("show");
}
function clearRoute(){
  if(S.map){
    if(S.rLine){S.map.removeLayer(S.rLine);S.rLine=null}
    if(S.rCase){S.map.removeLayer(S.rCase);S.rCase=null}
    if(S.rEnd){S.map.removeLayer(S.rEnd);S.rEnd=null}
  }
  $("routebar").classList.remove("show");
  S.routeFor=null;
}
function planRoute(r){
  if(!window.L){loadLeaflet(function(){initMap();planRoute(r)});return}
  if(!S.map)initMap();
  setTab("map");
  closeSheet();
  if(!S.me){
    S.pendingRoute=r;
    askGeo();
    showRouteMsg("要攞到你位置先畫到路線——開咗定位會自動幫你畫");
    return;
  }
  var btn=$("s-route");
  if(btn){btn.textContent="畫緊路線…";btn.disabled=true}
  var ac=(typeof AbortController<"u")?new AbortController():null;
  if(ac)setTimeout(function(){ac.abort()},12000);
  fetch(OSRM+S.me[1]+","+S.me[0]+";"+r.lng+","+r.lat+
    "?overview=full&geometries=geojson&steps=true&alternatives=false",
    ac?{signal:ac.signal}:undefined)
  .then(function(x){return x.json()})
  .then(function(j){
    if(btn){btn.textContent="喺地圖畫路線（唔使開 Maps）";btn.disabled=false}
    if(!j.routes||!j.routes.length){showRouteMsg("路線服務暫時回應唔到，可以用導航掣開 Maps");return}
    var rt=j.routes[0],pts=rt.geometry.coordinates.map(function(c){return[c[1],c[0]]});
    clearRoute();
    S.routeFor=r.id;
    S.rCase=L.polyline(pts,{color:"#fff",weight:8.5,opacity:.92,interactive:false}).addTo(S.map);
    S.rLine=L.polyline(pts,{color:"#1a73e8",weight:5,opacity:.95,interactive:false}).addTo(S.map);
    S.rEnd=L.circleMarker([r.lat,r.lng],{radius:7,color:"#fff",weight:3,fillColor:"#c0392b",fillOpacity:1,interactive:false}).addTo(S.map);
    var mins=Math.max(1,Math.round(rt.duration/60));
    $("rb-sum").textContent=fmtD(rt.distance)+" · 揸車約 "+mins+" 分鐘";
    var sts=(rt.legs[0]&&rt.legs[0].steps)||[];
    $("rb-steps").style.display="";
    $("rb-steps").textContent="轉彎指示 "+sts.length+" ▾";
    $("rb-steps").dataset.t="轉彎指示 "+sts.length+" ▾";
    $("steps").innerHTML=sts.map(function(st,i){
      return '<div class="st"><b>'+(i+1)+'</b><span>'+esc(stepText(st))+'</span></div>';
    }).join("");
    $("steps").style.display="none";
    $("routebar").classList.add("show");
    if(pts.length>1)S.map.fitBounds(L.latLngBounds(pts),
      {paddingTopLeft:[24,84],paddingBottomRight:[24,24]});
  })
  .catch(function(){
    if(btn){btn.textContent="喺地圖畫路線（唔使開 Maps）";btn.disabled=false}
    showRouteMsg("路線服務連唔上（網絡問題），可以用導航掣開 Maps");
  });
}

/* ---------- sheet ---------- */
function paintTrend(r){
  var el=$("s-trend");
  var rec=S.first[String(r.id)];
  var cur=(typeof r.num==="number"&&r.num>=0)?r.num:null;
  var ok=rec&&cur!=null;
  if(!ok){el.style.display="none";return}
  var mins=Math.max(1,Math.round((Date.now()-rec.ts)/60000));
  if(rec.num===cur){
    if(mins<2){el.style.display="none";return}
    el.style.display="block";
    el.innerHTML=mins+" 分鐘前睇過，<b class=\"flat\">"+cur+" 個位冇變</b>";
    return;
  }
  var diff=cur-rec.num;
  var cls=diff>0?"up":"down";
  var word=diff>0?"+":"";
  el.style.display="block";
  el.innerHTML=mins+" 分鐘前 "+rec.num+" → 而家 <b class=\""+cls+"\">"+cur+
    "（"+word+diff+"）</b>"+(diff>0?" · 多咗位":" · 快手啲");
}
/* ---------- 歷史趨勢：profile.json.gz（每週聚合嘅「習慣檔」） ---------- */
function loadProf(){
  if(S.prof)return Promise.resolve(S.prof);
  if(S.profTried)return Promise.resolve(null);
  S.profTried=true;
  if(!("DecompressionStream" in window))return Promise.resolve(null);
  return fetch("data/profile.json.gz?v="+new Date().toISOString().slice(0,10),{cache:"no-cache"})
  .then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()})
  .then(function(buf){
    var ds=new DecompressionStream("gzip");
    return new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  })
  .then(function(txt){S.prof=JSON.parse(txt);return S.prof})
  .catch(function(){S.prof=null;return null});
}
function paintHist(r){
  var el=$("s-hist");
  if(!S.prof){
    loadProf().then(function(){if(S.sel===r)paintHist(r)});
    el.style.display="none";return;
  }
  var p=S.prof.parks&&S.prof.parks[String(r.id)];
  if(!p||!p.bins){el.style.display="none";return}
  /* profile bins 用香港時間（星期一=0）；設備時區唔一定係香港，自己換算 */
  var d=new Date(),hk=d.getUTCHours()+8;
  var h=hk%24, shift=hk>=24?1:0;
  var mon0=(d.getUTCDay()+6+shift)%7;
  var b=p.bins[mon0+"-"+h];

function initMap(){
  if(S.map||!window.L)return;
  S.map=L.map("map",{zoomControl:false,preferCanvas:true,attributionControl:false}).setView([22.34,114.14],11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,detectRetina:true}).addTo(S.map);
  S.markers=L.layerGroup().addTo(S.map);
  S.map.on("zoomend moveend resize",drawPins);
  addMe();
  drawPins();

window.__map=function(){return S.map};window.__S=function(){return S};window.__paintTrend=paintTrend;
window.NAV=NAV;window.wgs2gcj=wgs2gcj;
function addMe(){
  if(!S.map||!S.me)return;
  if(!S.meM){
    S.meM=L.marker(S.me,{
      icon:L.divIcon({html:'<div class="me"></div>',className:"",iconSize:[18,18],iconAnchor:[9,9]}),

    }).addTo(S.map);

function drawLine(r){
  if(!S.map)return;
  if(S.rLine)return; /* 已畫咗真路線，唔好再疊條直線虛線 */
  if(S.line){S.map.removeLayer(S.line);S.line=null}
  if(!S.me||!r)return;
  S.line=L.polyline([S.me,[r.lat,r.lng]],{color:"#1a73e8",weight:3.5,dashArray:"7 8",opacity:.85,interactive:false}).addTo(S.map);

function drawPins(){
  if(!S.map)return;
  var z=S.map.getZoom(), b=S.map.getBounds();
  S.markers.clearLayers();
  if(z<13){
    /* 遠景：像素網格聚合，避免幾百個標籤疊死 */
    var grid={},W=52,cap=0;
    for(var i=0;i<S.view.length;i++){
      var r=S.view[i];
      if(!b.contains([r.lat,r.lng]))continue;
      var p=S.map.latLngToContainerPoint([r.lat,r.lng]);
      var k=Math.floor(p.x/W)+"_"+Math.floor(p.y/W);
      var g=grid[k]||(grid[k]={n:0,free:0,c:0,lat:0,lng:0,ok:0});
      g.n++;g.c++;g.lat+=r.lat;g.lng+=r.lng;
      if(r.num!=null){g.free+=r.num;g.ok++}
    }
    Object.keys(grid).forEach(function(k){
      if(cap++>160)return;
      var g=grid[k];
      var lat=g.lat/g.c, lng=g.lng/g.c;
      var big=g.n>=12;
      var size=big?42:36;
      var l=g.ok&&g.free>0?"ok":(g.free===0&&g.ok?"bad":"na");
      var html='<div class="pin v-'+l+'" style="width:'+size+'px;height:'+size+'px;font-size:'+(big?13:12)+'px;border-width:2.5px">'+g.n+'</div>';
      var icon=L.divIcon({html:html,className:"",iconSize:[size,size],iconAnchor:[size/2,size/2]});
      L.marker([lat,lng],{icon:icon,keyboard:false})
        .on("click",function(){S.map.setView([lat,lng],14)})
        .addTo(S.markers);
    });
    return;
  }
  /* 近景：逐場顯示車位數 */
  var n=0;
  for(var j=0;j<S.view.length;j++){
    var r2=S.view[j];
    if(!b.contains([r2.lat,r2.lng]))continue;
    var lv=lvl(r2), txt=numText(r2);
    var sz=z>=15?38:32, fs=z>=15?13.5:12;
    var html2='<div class="pin v-'+lv+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+fs+'px">'+txt+'</div>';
    var ic=L.divIcon({html:html2,className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    var m=L.marker([r2.lat,r2.lng],{icon:ic,keyboard:false,title:r2.n});
    (function(rr){m.on("click",function(){open(S.view.indexOf(rr))})})(r2);
    S.markers.addLayer(m);
    if(++n>600)break;
  }
  if(n===0){
    /* 容器啱啱由 display:none 變返可見，bounds 可能未計好——重試一次 */
    setTimeout(function(){if(S.map){S.map.invalidateSize();drawPins()}},160);
  }
}

/* 路況地圖：TD 800 個路面感應器即時車速，自砌似高德嘅紅黃綠 */
var DET_CSV="https://static.data.gov.hk/td/traffic-data-strategic-major-roads/info/traffic_speed_volume_occ_info.csv";
var SPEED_XML="https://resource.data.one.gov.hk/td/traffic-detectors/rawSpeedVol-all.xml";
function speedColor(v){
  if(v==null)return"#b8b5ad";
  if(v<15)return"#8e1b12";
  if(v<30)return"#d93025";
  if(v<45)return"#f4a300";
  return"#12855a";
}
function csvSplit(line){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++} else q=!q; }
    else if(ch===","&&!q){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur);
  return out;
}
function initTrafMap(){
  if(S.tmap||!window.L)return;
  S.tmap=L.map("tmap",{zoomControl:false,preferCanvas:true,attributionControl:false})
    .setView([22.335,114.16],11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,detectRetina:true}).addTo(S.tmap);
  S.tlay=L.layerGroup().addTo(S.tmap);
  S.tmap.on("zoomend",drawTraf);
}
function loadDetList(){
  if(S.detList)return Promise.resolve(S.detList);
  try{
    var c=JSON.parse(localStorage.getItem("hkp_det2")||"null");
    if(c&&c.d&&Object.keys(c.d).length){S.detList=c.d;return Promise.resolve(c.d)}
  }catch(e){}
  return fetch(DET_CSV,{cache:"force-cache"}).then(function(r){return r.text()}).then(function(txt){
    var lines=txt.replace(/\r/g,"").split("\n"),out={};
    for(var i=1;i<lines.length;i++){
      if(!lines[i])continue;
      var c=csvSplit(lines[i]);
      if(c.length<9)continue;
      var id=(c[0]||"").trim(),lat=parseFloat(c[7]),lon=parseFloat(c[8]);
      if(!id||isNaN(lat)||isNaN(lon))continue;
      /* 路名去掉「近乜乜」描述，得出主路名，方便同路探測器連線 */
      var road=(c[3]||"").trim();
      var base=road.split("近")[0].replace(/[-,，]\s*$/,"").trim()||road;
      out[id]=[lat,lon,road,(c[9]||"").trim(),base,(c[1]||"").trim()];
    }
    S.detList=out;
    try{localStorage.setItem("hkp_det2",JSON.stringify({at:Date.now(),d:out}))}catch(e){}
    return out;
  });
}
function drawTraf(){
  if(!S.tmap||!S.tpts)return;
  var z=S.tmap.getZoom(),r=z>=15?8:z>=13?6:4;
  S.tlay.clearLayers();
  var b=S.tmap.getBounds(),vis=[];
  S.tpts.forEach(function(p){
    if(!b.contains([p.lat,p.lng]))return;
    vis.push(p);
  });
  /* 同一條路同方向、相距近 → 連線，令佢似高德成條路著色 */
  if(z>=12){
    var groups={};
    vis.forEach(function(p){
      var k=(p.base||p.road)+"|"+p.dir+"|"+(p.dist||"");
      (groups[k]||(groups[k]=[])).push(p);
    });
    var drawn=0,seenP={};
    Object.keys(groups).forEach(function(k){
      var a=groups[k];
      if(a.length<2)return;
      for(var i=0;i<a.length;i++){
        var best=null,bd=1e9;
        for(var j=0;j<a.length;j++){
          if(i===j)continue;
          var dx=(a[j].lng-a[i].lng)*102000,dy=(a[j].lat-a[i].lat)*111000;
          var dd=Math.sqrt(dx*dx+dy*dy);
          if(dd<bd){bd=dd;best=a[j]}
        }
        if(!best||bd>=400||drawn>=1200)continue;
        var pk=(a[i].id<best.id?a[i].id+"|"+best.id:best.id+"|"+a[i].id);
        if(seenP[pk])continue;
        seenP[pk]=1;
        var v=(a[i].v==null?best.v:a[i].v);
        var v2=(best.v==null?v:Math.min(v==null?999:v,best.v));
        L.polyline([[a[i].lat,a[i].lng],[best.lat,best.lng]],
          {color:speedColor(v2),weight:4.5,opacity:.85,interactive:false}).addTo(S.tlay);
        drawn++;
      }
    });
  }
  vis.forEach(function(p){
    var m=L.circleMarker([p.lat,p.lng],{radius:r,stroke:false,
      fillColor:speedColor(p.v),fillOpacity:.92});
    m.on("click",function(){
      m.bindPopup("<b>"+esc(p.road)+"</b><br>"+esc(p.dir||"")+"<br>"+
        (p.v==null?"暫無車速數據":"最慢車道 <b>"+p.v+" km/h</b>")+
        (p.occ!=null?"<br>路面佔用 "+p.occ+"%":"")).openPopup();
    });
    m.addTo(S.tlay);
  });
}
function loadTraf(){
  if(!window.L){loadLeaflet(function(){initTrafMap();loadTraf()});return}
  initTrafMap();
  setTimeout(function(){if(S.tmap)S.tmap.invalidateSize()},80);
  if(!S.tmap){$("tstamp").textContent="地圖載入失敗";return}
  var t=Date.now();
  $("tstamp").innerHTML="路況更新中…";
  loadDetList().then(function(det){
    return fetch(SPEED_XML,{cache:"no-store"}).then(function(r){return r.text()}).then(function(xml){
      var doc=new DOMParser().parseFromString(xml,"application/xml");
      var ds=doc.getElementsByTagName("detector");
      var pts=[],slow=0,bad=0,tm="";
      var tf=doc.getElementsByTagName("period_from")[0];
      if(tf)tm=tf.textContent.slice(0,5);
      for(var i=0;i<ds.length;i++){
        var d=ds[i],idEl=d.getElementsByTagName("detector_id")[0];
        if(!idEl)continue;
        var id=idEl.textContent.trim(),info=det[id];
        if(!info)continue;
        var lanes=d.getElementsByTagName("lane"),sp=[],occ=[];
        for(var j=0;j<lanes.length;j++){
          var s=lanes[j].getElementsByTagName("speed")[0];
          var o=lanes[j].getElementsByTagName("occupancy")[0];
          var vd=lanes[j].getElementsByTagName("valid")[0];
          if(s&&(!vd||vd.textContent!=="N"))sp.push(parseInt(s.textContent,10));
          if(o)occ.push(parseInt(o.textContent,10));
        }
        var v=sp.length?Math.min.apply(null,sp):null;
        if(v!=null&&isNaN(v))v=null;
        var oc=occ.length?Math.max.apply(null,occ):null;
        if(v===0&&(oc==null||oc===0))v=null; /* 冇車／死感應器 → 灰色 */
        pts.push({id:id,lat:info[0],lng:info[1],road:info[2],dir:info[3],
                  base:info[4]||info[2],dist:info[5]||"",v:v,occ:oc});
      }
      /* XML 有多個時段，同一探測器會重複 → 去重（後者較新） */
      var uniq={};
      pts.forEach(function(p){uniq[p.id]=p});
      pts=Object.keys(uniq).map(function(k){return uniq[k]});
      for(var q=0;q<pts.length;q++){
        if(pts[q].v==null)bad++; else if(pts[q].v<30)slow++;
      }
      S.tpts=pts;S.trafAt=t;
      drawTraf();
      $("tstamp").innerHTML="<b>"+(tm?tm+" 更新":"已更新")+"</b> · "+pts.length+" 個感應器<br>"+
        "擠塞 <b style='color:#d93025'>"+slow+"</b> 個 · 無數據 "+bad;
      loadNews();
    });
  }).catch(function(){
    $("tstamp").textContent="路況數據攞唔到（網絡問題），等陣自動再試";
  });
}
function loadNews(){
  fetch("https://resource.data.one.gov.hk/td/tc/specialtrafficnews.xml",{cache:"no-store"})
  .then(function(r){return r.text()})
  .then(function(txt){
    var doc=new DOMParser().parseFromString(txt,"application/xml");
    var ms=doc.getElementsByTagName("message"),arr=[];
    for(var i=0;i<ms.length;i++){
      var g=function(n){var e=ms[i].getElementsByTagName(n)[0];return e?e.textContent:""};
      var body=(g("ChinShort")||g("ChinText")||"").replace(/\s+/g," ").trim();
      if(!body)continue;
      arr.push({id:parseInt(g("msgID"),10)||0,st:g("CurrentStatus"),txt:body});
    }
    arr.sort(function(a,b){
      var la=a.st==="2"?0:1, lb=b.st==="2"?0:1;
      return (la-lb)||(b.id-a.id);
    });
    var live=arr.filter(function(x){return x.st==="2"});
    var done=arr.filter(function(x){return x.st!=="2"});
    arr=live.slice(0,4).concat(done.slice(0,4));
    var box=$("nlist");
    if(!arr.length){box.innerHTML='<div class="tnote">而家冇特別交通消息</div>';return}
    box.innerHTML=arr.map(function(x){
      var live=x.st==="2";
      return '<div class="ni'+(live?" live":"")+'"><span class="dot"></span><div class="nt">'+
        (live?"":"<span style=\"opacity:.6\">已解封 · </span>")+esc(x.txt)+'</div></div>';
    }).join("");
    var d=new Date(),p=function(n){return (n<10?"0":"")+n};
    $("nstamp").textContent=arr.length+" 條 · "+p(d.getHours())+":"+p(d.getMinutes());
    $("tnews-n").textContent=arr.length+" 條";
    $("tnews-dot").className="nd"+(live.length?"":" off");
  })
  .catch(function(){$("nlist").innerHTML='<div class="tnote">交通消息暫時攞唔到（網絡問題）</div>';
    $("tnews-n").textContent="—"});
}

var qt=0, sugT=0, sugReq=0;

/* 搜目的地：本機車場名搜唔到時，用 Photon（OSM）地理編碼搵地方（限香港 bbox） */
var PHOTON="https://photon.komoot.io/api/?limit=6&lang=default&bbox=113.82,22.13,114.46,22.62&q=";
function suggest(v){
  var q=(v||"").trim();
  if(q.length<2){hideSugg();return}
  var ql=q.toLowerCase();
  var hits=0;
  for(var i=0;i<S.rows.length;i++){
    var r=S.rows[i];
    if((r.n+" "+r.d+" "+r.a).toLowerCase().indexOf(ql)>=0&&++hits>=4)break;
  }
  if(hits>=4){hideSugg();return}  /* 本機已經搵到，唔使上網 */
  var my=++sugReq;
  fetch(PHOTON+encodeURIComponent(q),{cache:"no-store"}).then(function(r){return r.json()})
  .then(function(j){
    if(my!==sugReq)return;
    var list=(j.features||[]).filter(function(f){
      return f.geometry&&f.geometry.coordinates&&f.properties.name;
    });
    if(!list.length){hideSugg();return}
    var box=$("sugg");
    box.innerHTML='<div class="hd">搵唔到同名車場？去以下地方附近搵：</div>'+
      list.map(function(f,i){
        var p=f.properties;
        var nm=p.name;
        var sub=[p.street,p.locality,p.district].filter(Boolean)
          .join(" · ").replace(/ Hong Kong| 香港/g,"");
        return '<button class="sg" data-i="'+i+'"><b>'+esc(nm)+'</b><small>'+esc(sub)+'</small></button>';
      }).join("");
    box.style.display="block";
    Array.prototype.forEach.call(box.querySelectorAll(".sg"),function(b){
      b.onclick=function(){pickDest(list[b.dataset.i])};
    });
  }).catch(function(){hideSugg()});
}
function hideSugg(){$("sugg").style.display="none"}
document.addEventListener("click",function(e){
  if(!e.target.closest("#sugg")&&!e.target.closest(".search"))hideSugg();
});
function pickDest(f){
  var c=f.geometry&&f.geometry.coordinates;
  if(!c)return;
  var lat=parseFloat(c[1]),lng=parseFloat(c[0]);
  var nm=(f.properties.name||"").trim();
  if(isNaN(lat)||isNaN(lng)||!nm)return;
  hideSugg();
  $("q").value="";S.q="";apply();
  setDest([lat,lng,nm]);
}
function setDest(d){
  S.dest=d;
  $("dest-name").textContent=d[2];
  $("destbar").style.display="flex";
  apply();
  if(S.map){
    if(S.destM)S.map.removeLayer(S.destM);
    S.destM=L.marker([d[0],d[1]],{
      icon:L.divIcon({html:'<div style="font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">🚩</div>',
        className:"",iconSize:[26,26],iconAnchor:[13,26]}),
      zIndexOffset:1500,interactive:false}).addTo(S.map);
    S.map.setView([d[0],d[1]],15,{animate:true});
  }
  $("stamp").innerHTML="已按「"+esc(d[2])+"」附近排序<br>實時車位每 90 秒更新";
}
$("dest-x").onclick=function(){
  S.dest=null;
  $("destbar").style.display="none";
  if(S.destM&&S.map){S.map.removeLayer(S.destM);S.destM=null}
  apply();
  $("stamp").innerHTML="已清除目的地<br>實時車位每 90 秒更新";
};
$("q").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var b=$("sugg").querySelector(".sg");
    if(b&&$("sugg").style.display==="block"){e.preventDefault();b.click();this.blur()}
  }
});
function askGeo(){
  if(!navigator.geolocation){$("stamp").textContent="此瀏覽器不支援定位";return}
  $("geo").textContent="…";
  $("bgeo").textContent="…";
  navigator.geolocation.getCurrentPosition(function(p){
    S.me=[p.coords.latitude,p.coords.longitude];
    $("geo").textContent="●";
    $("geo").style.color="var(--ok)";
    $("banner").style.display="none";$("banner").dataset.dismissed="1";
    if(S.dist){S.dist="";distEl.value="";distEl.classList.remove("on")}
    apply();
    if(S.map){addMe();drawLine(S.sel);S.map.setView(S.me,15)}
    if(S.pendingRoute){var pr=S.pendingRoute;S.pendingRoute=null;planRoute(pr)}
    $("stamp").innerHTML="已按你位置排序<br>實時車位每 90 秒更新";
  },function(){
    $("geo").textContent="◎";
    $("bgeo").textContent="開啟";
    $("banner").style.display="none";$("banner").dataset.dismissed="1";
    try{localStorage.setItem("hkp_geooff","1")}catch(e){}
    $("stamp").innerHTML="未開啟定位<br>可用地區篩選";
  },{timeout:9000,maximumAge:120000});
}
$("geo").onclick=askGeo;
$("locate").onclick=function(){
  if(S.me&&S.map){addMe();S.map.setView(S.me,15,{animate:true})}
  else askGeo();
};
$("bgeo").onclick=askGeo;
$("bx").onclick=function(){
  $("banner").style.display="none";$("banner").dataset.dismissed="1";
  try{localStorage.setItem("hkp_geooff","1")}catch(e){}
};

/* ---------- boot ---------- */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)fetchVac();
});
setInterval(fetchVac,REFRESH);
loadInfo();
try{
  if(localStorage.getItem("hkp_geooff")){$("banner").dataset.dismissed="1"}
  else{$("banner").style.display="flex"}
}catch(e){}

// 壓測模式：?stress=3000 覆製樣本
var mq=/[?&]stress=(\d+)/.exec(location.search);
if(mq){/* 由 console 用 __stress() 觸發，避免正常用戶誤開 */}
window.__stress=function(k){
  var base=S.rows.slice(0,Math.min(60,S.rows.length));
  var out=[];
  for(var i=0;i<k;i++){
    var t=Object.assign({},base[i%base.length]);
    t.id="s"+i;t.n=t.n+" #"+i;t.lat=t.lat+(i%40)*0.001;t.lng=t.lng+(i%37)*0.001;
    out.push(t);
  }
  S.rows=out;S.me=null;apply();
  return out.length;
};
})();
</script>
</body>
</html>
