<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="香港未来九日落雨机会预报＋实时分区雨量（资料来源：香港天文台）">
<title>香港落雨预报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Ctext x='32' y='46' font-size='34' font-family='system-ui' text-anchor='middle'%3E%F0%9F%8C%A7%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --ink:#15161a; --ink2:#6b6e78; --line:#e6e3dc;
  --ok:#1e9e5a; --okbg:#e3f3ea; --warn:#b98a1a; --warnbg:#f7eed8;
  --mid:#d06014; --midbg:#fbe9dd; --bad:#c43d3d; --badbg:#f7e1e1;
  --accent:#2b6cb0; --pill:#eceae4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1012; --card:#1a1d21; --ink:#f4f3f0; --ink2:#a9adb6; --line:#34383f;
    --ok:#4fc48a; --okbg:#1b2f25; --warn:#d8b055; --warnbg:#2f2817;
    --mid:#e08a52; --midbg:#33251a; --bad:#e07373; --badbg:#331c1c;
    --accent:#6ea8dc; --pill:#23272d;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;max-width:520px;margin:0 auto;
}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 6px;flex:0 0 auto}
header h1{font-size:21px;font-weight:700;letter-spacing:.5px}
header .sub{color:var(--ink2);font-size:12px;margin-top:2px}
main{flex:1;overflow-y:auto;padding:8px 14px calc(20px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
#map{padding:12px 8px}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px;letter-spacing:1px}
/* 结论卡 */
#verdict .big{font-size:17px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#verdict .big svg{flex:0 0 27px}
#verdict .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
#verdict .row:first-of-type{border-top:none}
#verdict .k{color:var(--ink2)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.b-ok{color:var(--ok);background:var(--okbg)} .b-warn{color:var(--warn);background:var(--warnbg)}
.b-mid{color:var(--mid);background:var(--midbg)} .b-bad{color:var(--bad);background:var(--badbg)}
.b-na{color:var(--ink2);background:var(--pill)}
/* 而家 */
#now .chips{display:flex;flex-wrap:wrap;gap:8px}
#now .chip{background:var(--pill);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
#now .chip small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
#now .dry{color:var(--ink2)}
/* 九日 */
.day{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:none}
.day .ic{flex:0 0 30px;text-align:center;line-height:0}
.day .dt{flex:0 0 66px}
.day .dt b{display:block;font-size:15px}
.day .dt span{font-size:11px;color:var(--ink2)}
.day .wx{flex:1;min-width:0}
.day .wx b{display:block;font-size:14px;line-height:1.3}
.day .wx span{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.day .psr{flex:0 0 auto;text-align:right}
.wknd .dt b{color:var(--accent)}
/* 分区地图 */
#map svg{width:100%;height:auto;display:block}
#map path.d{stroke:rgba(255,255,255,.07);stroke-width:.8;vector-effect:non-scaling-stroke}
#map text{pointer-events:none;font-family:inherit}
#map .lb rect{fill:var(--card);fill-opacity:.95}
#map .lb text{font-size:14px;font-weight:600;text-anchor:middle;fill:var(--ink);font-variant-numeric:tabular-nums}
#map .lb.dry text{fill:var(--ink2);font-weight:500}
#map .s0{stroke:var(--line)} #map .s1{stroke:#4d9bd6} #map .s2{stroke:#2fa8a0}
#map .s3{stroke:#e6b93f} #map .s4{stroke:#ec8a3c} #map .s5{stroke:#e05545}
#map .f0{fill:var(--map0)}
#map .f1{fill:#4d9bd6} #map .f2{fill:#2fa8a0} #map .f3{fill:#e6b93f}
#map .f4{fill:#ec8a3c} #map .f5{fill:#e05545}
@media (prefers-color-scheme: dark){
  :root{--map0:#2c3546}
  #map path.d{stroke:rgba(255,255,255,.07)}
}
@media (prefers-color-scheme: light){
  :root{--map0:#dde3ea}
  #map path.d{stroke:rgba(0,0,0,.14)}
}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(128,128,128,.3)}
.legend i.f0{background:var(--map0)} .legend i.f1{background:#4d9bd6} .legend i.f2{background:#2fa8a0}
.legend i.f3{background:#e6b93f} .legend i.f4{background:#ec8a3c} .legend i.f5{background:#e05545}
.legend .rad{margin-left:auto;color:var(--ink2);font-size:11px} .legend .rad b{font-weight:600;font-variant-numeric:tabular-nums}
.foot{color:var(--ink2);font-size:11.5px;padding:4px 4px 0;text-align:center}
.err{text-align:center;color:var(--ink2);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>香港落雨预报</h1>
  <div class="sub" id="upd">载入中…</div>
</header>
<main>
  <div class="card" id="verdict"><h2>直接答案</h2><div class="err">载入中…</div></div>
  <div class="card" id="map"><h2>分区雨量地图 · 过去一小时（mm）</h2><div class="err">载入中…</div><div class="legend" id="legend"></div></div>
  <div class="card" id="now"><h2>当前实雨 · 过去一小时</h2><div class="err">载入中…</div></div>
  <div class="card" id="fnd"><h2>未来九日</h2><div class="err">载入中…</div></div>
  <div class="foot">资料来源：香港天文台开放数据 · 落雨机会为「显著雨概率」（低/中/高）<br>实时雨量每小时更新 · 本页每 15 分钟自动刷新</div>
</main>
<script src="hk_map.js?v=20261117d"></script>
<script>
(function(){
"use strict";
var RANK={"低":0,"中低":1,"中":2,"中高":3,"高":4};
var BCLS={0:"b-ok",1:"b-warn",2:"b-mid",3:"b-mid",4:"b-bad"};
var BNAME={0:"机会低",1:"机会中低",2:"机会中",3:"机会中高",4:"机会高"};
function badge(psr){
  if(psr==null||RANK[psr]===undefined)return '<span class="badge b-na">—</span>';
  var r=RANK[psr];
  return '<span class="badge '+BCLS[r]+'">'+psr+" · "+BNAME[r]+"</span>";
}
function get(url){
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function err(el,msg){el.innerHTML='<div class="err">'+msg+"</div>";}

/* ---- 天氣 SVG 圖標（按天文台 forecastIcon 編號映射）---- */
var CLD='<path d="M6.2 17h10.6a3.6 3.6 0 0 0 .55-7.16A5.1 5.1 0 0 0 7.1 8.3A4.3 4.3 0 0 0 6.2 17z" fill="#9aa7b5"/>';
function cloudy(f){return '<path d="M6.2 17h10.6a3.6 3.6 0 0 0 .55-7.16A5.1 5.1 0 0 0 7.1 8.3A4.3 4.3 0 0 0 6.2 17z" fill="'+(f||"#9aa7b5")+'"/>';}
function sunBody(c){
  c=c||"#f6b93b";
  return '<g stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2.8" x2="12" y2="5.2"/><line x1="12" y1="18.8" x2="12" y2="21.2"/><line x1="2.8" y1="12" x2="5.2" y2="12"/><line x1="18.8" y1="12" x2="21.2" y2="12"/><line x1="5.5" y1="5.5" x2="7.2" y2="7.2"/><line x1="16.8" y1="16.8" x2="18.5" y2="18.5"/><line x1="5.5" y1="18.5" x2="7.2" y2="16.8"/><line x1="16.8" y1="7.2" x2="18.5" y2="5.5"/></g><circle cx="12" cy="12" r="4.6" fill="'+c+'"/>';
}
var SVGS={
  sun:'<svg viewBox="0 0 24 24" width="27" height="27">'+sunBody("#f6b93b")+"</svg>",
  hot:'<svg viewBox="0 0 24 24" width="27" height="27">'+sunBody("#e0704a")+"</svg>",
  partly:'<svg viewBox="0 0 24 24" width="27" height="27"><circle cx="8.5" cy="8.5" r="4" fill="#f6b93b"/><g transform="translate(0,1.5)">'+CLD+"</g></svg>",
  cloud:'<svg viewBox="0 0 24 24" width="27" height="27">'+CLD+"</svg>",
  over:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(6.2,-4.6) scale(.68)">'+cloudy("#aab7c4")+'</g><g transform="translate(0,1.2)">'+cloudy("#7d8894")+"</g></svg>",
  fog:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2.5)">'+CLD+'</g><g stroke="#9aa7b5" stroke-width="1.4" stroke-linecap="round"><line x1="7" y1="18.5" x2="17" y2="18.5"/><line x1="9" y1="20.8" x2="15" y2="20.8"/></g></svg>',
  rain:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2)">'+CLD+'</g><g stroke="#4f9bd5" stroke-width="1.5" stroke-linecap="round"><line x1="9.5" y1="17.5" x2="8.6" y2="20.2"/><line x1="13" y1="17.5" x2="12.1" y2="20.2"/><line x1="16.5" y1="17.5" x2="15.6" y2="20.2"/></g></svg>',
  heavy:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2.6)">'+cloudy("#7d8894")+'</g><g stroke="#3f8ecb" stroke-width="1.9" stroke-linecap="round"><line x1="8.4" y1="16.8" x2="7.2" y2="21.4"/><line x1="11.6" y1="16.8" x2="10.4" y2="21.4"/><line x1="14.8" y1="16.8" x2="13.6" y2="21.4"/><line x1="18" y1="16.8" x2="16.8" y2="21.4"/></g></svg>',
  storm:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2)">'+CLD+'</g><path d="M12.9 15.5l-2.7 4.6h2.2l-1.3 3.2 3.9-5h-2.1l1.5-2.8z" fill="#f2c14e"/></svg>',
  snow:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2)">'+CLD+'</g><g stroke="#bfe3f5" stroke-width="1.4" stroke-linecap="round"><line x1="9.5" y1="17.4" x2="9.5" y2="20.4"/><line x1="8.2" y1="18.2" x2="10.8" y2="19.6"/><line x1="10.8" y1="18.2" x2="8.2" y2="19.6"/><line x1="15.4" y1="17.4" x2="15.4" y2="20.4"/><line x1="14.1" y1="18.2" x2="16.7" y2="19.6"/><line x1="16.7" y1="18.2" x2="14.1" y2="19.6"/></g></svg>',
  rain2:'<svg viewBox="0 0 24 24" width="27" height="27"><g transform="translate(0,-2)">'+CLD+'</g><g stroke="#4f9bd5" stroke-width="1.4" stroke-linecap="round"><line x1="10.5" y1="17.5" x2="9.8" y2="20"/><line x1="14.5" y1="17.5" x2="13.8" y2="20"/></g></svg>',
  sunshower:'<svg viewBox="0 0 24 24" width="27" height="27"><circle cx="7.5" cy="6.5" r="3.4" fill="#f6b93b"/><g transform="translate(1.5,1.8)">'+CLD+'</g><g stroke="#4f9bd5" stroke-width="1.4" stroke-linecap="round"><line x1="10" y1="20.2" x2="9.2" y2="22.2"/><line x1="14.5" y1="20.2" x2="13.7" y2="22.2"/></g></svg>',
  wind:'<svg viewBox="0 0 24 24" width="27" height="27"><g stroke="#9cc3e0" stroke-width="1.7" stroke-linecap="round" fill="none"><path d="M3 10h10.5a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 14.5h13.5a2.8 2.8 0 1 1-2.8 2.8"/></g></svg>',
  drip:'<svg viewBox="0 0 24 24" width="27" height="27"><path d="M12 3.5c3 4.2 5 7 5 9.5A5 5 0 0 1 7 13c0-2.5 2-5.3 5-9.5z" fill="#4f9bd5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" width="27" height="27"><path d="M14.5 4a8 8 0 1 0 5.5 9.5A6.5 6.5 0 0 1 14.5 4z" fill="#d8e3f0"/></svg>'
};
function wxIcon(n){
  n=parseInt(n,10);
  if(isNaN(n))return SVGS.cloud;
  if(n===50)return SVGS.sun;
  if(n===51||n===52)return SVGS.partly;
  if(n===53||n===54)return SVGS.sunshower;
  if(n===60)return SVGS.cloud;
  if(n===61)return SVGS.over;
  if(n===62)return SVGS.rain2;
  if(n===63)return SVGS.rain;
  if(n===64)return SVGS.heavy;
  if(n===65)return SVGS.storm;
  if(n>=70&&n<=77)return SVGS.moon;
  if(n===80)return SVGS.wind;
  if(n===81)return SVGS.sun;
  if(n===82)return SVGS.drip;
  if(n>=83&&n<=85)return SVGS.fog;
  if(n===90)return SVGS.hot;
  if(n===91)return SVGS.sun;
  if(n===92)return SVGS.cloud;
  if(n===93)return SVGS.snow;
  return SVGS.cloud;
}

function paintFnd(d){
  var el=document.getElementById("verdict");
  var days=d.weatherForecast||[];
  if(!days.length){err(el,"天文台预报暂不可用，稍后自动重试");return;}
  var maxR=-1,maxDay=null;
  days.forEach(function(x){var r=RANK[x.PSR];if(r!==undefined&&r>maxR){maxR=r;maxDay=x;}});
  if(maxR<0)maxR=0;
  // 周末：取周六/周日 PSR 的最大等级
  var wkMax=-1,wkCount=0;
  days.forEach(function(x){
    var s=x.forecastDate,dt=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
    if(dt.getDay()===0||dt.getDay()===6){
      wkCount++;
      var r=RANK[x.PSR];
      if(r!==undefined&&r>wkMax)wkMax=r;
    }
  });
  if(wkMax<0)wkMax=0;
  var lines=[];
  var md=maxDay?(maxDay.forecastDate.slice(4,6)+"/"+maxDay.forecastDate.slice(6,8)):"";
  if(maxR===0){
    lines.push('<div class="big">'+SVGS.sun+'<span class="bigtx">未来九日大致干燥，落雨机会偏低</span></div>');
  }else{
    lines.push('<div class="big">'+SVGS.rain+'<span class="bigtx">最易落雨：'+wkPrefix(maxDay.forecastDate)+maxDay.week+" "+md+'（机会'+maxDay.PSR+'）</span></div>');
  }
  lines.push('<div class="row"><span class="k">周末'+(wkCount===2?"（周六＋周日）":"")+"落雨机会</span>"
    +(wkCount?'<span class="badge '+BCLS[wkMax]+'">'+psrFromRank(wkMax)+"</span>"
             :'<span class="badge b-na">预报期内无周末</span>')+"</div>");
  if(maxR>0){
    var wet=days.filter(function(x){return RANK[x.PSR]>=2;}).slice(0,3).map(function(x){return x.week;});
    if(wet.length)lines.push('<div class="row"><span class="k">明显有雨的日子</span><span>'+wet.join("、")+"</span></div>");
  }
  el.innerHTML='<h2>直接答案</h2>'+lines.join("");

  var f=document.getElementById("fnd");
  var rows=days.map(function(x){
    var s=x.forecastDate,dt=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
    var g=dt.getDay(),isWk=(g===0||g===6);
    var hm=x.forecastHumidity||{},hi=hm.min!=null?hm.min+"–"+hm.max+"%":null;
    var sub="<b>"+x.forecastMintemp.value+"–"+x.forecastMaxtemp.value+"°C</b>"+(hi?" · 湿度 "+hi:"");
    var ps=badgeShort(x.PSR);
    return '<div class="day'+(isWk?" wknd":"")+'">'
      +'<div class="ic">'+wxIcon(x.forecastIcon)+"</div>"
      +'<div class="dt"><b>'+x.week+"</b><span>"+s.slice(4,6)+"/"+s.slice(6,8)+(isWk?" · 周末":"")+"</span></div>"
      +'<div class="wx"><b>'+(x.forecastWeather||"—")+"</b><span>"+sub+"</span></div>"
      +'<div class="psr">'+ps+"</div>"
      +"</div>";
  });
  f.innerHTML="<h2>未来九日</h2>"+rows.join("");
}
function badgeShort(psr){
  if(psr==null||RANK[psr]===undefined)return '<span class="badge b-na">—</span>';
  return '<span class="badge '+BCLS[RANK[psr]]+'">'+psr+"</span>";
}
function wkPrefix(s){
  var d=new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8));
  var t=new Date(); t.setHours(0,0,0,0);
  return ((d-t)/86400000)>=7?"下":"";
}
function psrFromRank(r){for(var k in RANK){if(RANK[k]===r)return k;}return "低";}

/* 分区地图（rhrread 18 区） */
var T2S={"中西區":"中西区","東區":"东区","灣仔":"湾仔","南區":"南区","離島區":"离岛区","西貢":"西贡","大埔":"大埔","北區":"北区","元朗":"元朗","屯門":"屯门","荃灣":"荃湾","沙田":"沙田","葵青":"葵青","深水埗":"深水埗","油尖旺":"油尖旺","九龍城":"九龙城","黃大仙":"黄大仙","觀塘":"观塘"};
var RCLASS=[[50,"f5",">=50 mm"],[30,"f4","30–50 mm"],[15,"f3","15–30 mm"],[5,"f2","5–15 mm"],[0.1,"f1","<5 mm"],[-1,"f0","0 mm"]];
function rainCls(v){for(var i=0;i<RCLASS.length;i++){if(v>=RCLASS[i][0])return RCLASS[i][1];}return "f0";}
function paintMap(d){
  var el=document.getElementById("map");
  var vals={},best=null;
  (d.rainfall&&d.rainfall.data||[]).forEach(function(x){
    var v=parseFloat(x.max);if(isNaN(v))return;
    vals[x.place]=v;
    if(!best||v>best.v)best={n:x.place,v:v};
  });
  function valOf(z){var v=vals[z.n];if(v===undefined)v=vals[T2S[z.n]];return v===undefined?0:v;}
  var vb=HKD.vb,paths=[],labels=[],leaders=[];
  HKD.d.forEach(function(z){
    var v=valOf(z),cls=rainCls(v),txt=z.n+" "+(v>0?v:"0");
    paths.push('<path class="d '+cls+'" d="'+z.p+'"><title>'+z.n+" · "+v+" mm</title></path>");
    if(z.ax!==undefined)leaders.push('<line class="ld" x1="'+z.lx+'" y1="'+(z.ly-12)+'" x2="'+z.ax+'" y2="'+z.ay+'"/>');
    var w=z.n.length*14.1+String(v>0?v:"0").length*9.2+24;
    labels.push('<g class="lb '+cls+(cls==="f0"?" dry":"")+'"><rect x="'+(z.lx-w/2)+'" y="'+(z.ly-12)+'" width="'+w+'" height="24" rx="12"/>'
      +'<text x="'+z.lx+'" y="'+(z.ly+5)+'">'+txt+"</text></g>");
  });
  var svg='<svg viewBox="0 0 '+vb[0]+" "+vb[1]+'" role="img" aria-label="香港分区雨量地图">'
    +leaders.join("")+paths.join("")+labels.join("")+"</svg>";
  var sum=(best&&best.v>0)
    ? '<div class="msum">全港最多雨：<b>'+best.n+" "+best.v+" mm</b>"+(d.updateTime?" · 截至 "+d.updateTime.slice(11,16):"")+"</div>"
    : '<div class="msum">全港 18 区暂未录得雨量（0 mm）'+(d.updateTime?" · 截至 "+d.updateTime.slice(11,16):"")+"</div>";
  var legend=RCLASS.slice().reverse().map(function(r){
    return '<span><i class="'+r[1]+'"></i>'+r[2]+"</span>";
  }).join("");
  el.innerHTML='<h2>分区雨量地图 · 过去一小时（mm）</h2>'+sum+svg+'<div class="legend">'+legend
    +'<span class="rad" style="display:none">雷达 <b>--:--</b></span>'+"</div>";
  var sv=el.querySelector("svg");
  if(sv&&window.HKD&&HKD.radar)HKD.radar(sv,el.querySelector(".legend .rad"),(d.rainfall&&d.rainfall.data)||[]);

  el.dataset.upd=(d.updateTime||"").slice(11,16)||"";
}

function paintRain(d){
  var el=document.getElementById("now");
  var list=(d.hourlyRainfall||[]).map(function(s){
    var v=s.value;
    if(v==="TRACE")return {n:s.name,t:"微量",v:0.05};
    var f=parseFloat(v);
    return (isNaN(f)||f<=0)?null:{n:s.name,t:f+" mm",v:f};
  }).filter(Boolean).sort(function(a,b){return b.v-a.v;});
  if(!list.length){
    el.innerHTML='<h2>当前实雨 · 过去一小时</h2><div class="dry">全港暂无雨量记录（0 mm）'+(d.obsTime?" · 截至 "+d.obsTime.slice(11,16):"")+"</div>";
    return;
  }
  var chips=list.slice(0,8).map(function(s){
    return '<div class="chip">'+s.t+"<small>"+s.n+"</small></div>";
  }).join("");
  el.innerHTML='<h2>当前实雨 · 过去一小时（'+list.length+" 个站有雨"+(d.obsTime?" · 截至 "+d.obsTime.slice(11,16):"")+"）</h2>"
    +'<div class="chips">'+chips+"</div>";
}

function upd(t){
  var n=new Date();
  document.getElementById("upd").textContent="更新 "+n.toTimeString().slice(0,5)+" · 天文台 "+t;
}
function load(){
  var p1=get("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=sc");
  var p2=get("https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=sc");
  var p3=get("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=sc");
  p1.then(function(d){paintFnd(d);upd((d.updateTime||"").slice(11,16)||"—");}).catch(function(){err(document.getElementById("verdict"),"天文台预报暂不可用，稍后自动重试");});
  p2.then(paintRain).catch(function(){err(document.getElementById("now"),"实时雨量暂不可用");});
  p3.then(paintMap).catch(function(){err(document.getElementById("map"),"分区雨量暂不可用");});
}
var tmr;
function schedule(){clearTimeout(tmr);tmr=setTimeout(function(){load();schedule();},15*60*1000);}
document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
load();schedule();
})();
</script>
</body>
</html>
