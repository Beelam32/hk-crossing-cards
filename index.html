<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>過關實況 · 快照看板</title>
<meta name="description" content="香港口岸等候時間、天氣、過海隧道行車時間、口岸路面快拍（定時快照，非即時）">
<style>
:root{
  /* 對齊小程序 app.json：navigationBarBackgroundColor #0F1B2D / tabBar 選中 #5EC8FA / 未選 #7B8DA6 */
  --bg:#0F1B2D; --panel:#1A2A40; --panel2:#22344E; --line:#2E4260;
  --fg:#F0F4F8; --muted:#94A6BE; --accent:#5EC8FA; --gold:#F0B642;
  --tabbar:#0B1420; --taboff:#7B8DA6;
  --ok:#34C77B; --warn:#F3B23E; --bad:#EB5C5C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-text-size-adjust:100%}

/* ── 頂欄 ───────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,27,45,.97);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
header{padding:11px 16px 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  max-width:1180px;margin:0 auto}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.4px;white-space:nowrap}
h1 span{color:var(--accent)}
.spacer{flex:1}
.stat{font-size:12.5px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--fg);font-weight:600}

/* 語言 pill */
.langs{display:flex;gap:3px;background:var(--panel2);border-radius:9px;padding:3px}
.langs button{background:transparent;border:0;border-radius:7px;padding:4px 10px;
  font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
  transition:.15s;line-height:1.3}
.langs button:hover{color:var(--fg)}
.langs button.on{background:var(--accent);color:#0F1B2D}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;
  white-space:nowrap}
.btn:hover{color:var(--accent);border-color:var(--accent)}

/* ── 分頁 tab（小程序同款：早報／天氣／交通／自駕）─────── */
.tabs{display:flex;background:var(--tabbar);border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 0;min-width:88px;background:transparent;border:0;cursor:pointer;
  font-family:inherit;color:var(--taboff);padding:9px 6px 8px;font-size:12.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border-bottom:2px solid transparent;transition:.15s}
.tabs button .ic{font-size:17px;line-height:1;filter:grayscale(1) opacity(.55)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button.on .ic{filter:none}
.tabs button:hover{color:var(--accent)}

/* ── 內容 ───────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:13px 16px 40px}
.fresh{background:rgba(94,200,250,.10);border:1px solid rgba(94,200,250,.4);
  color:#CFEBFF;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-bottom:13px;
  line-height:1.65}
.fresh b{color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:13px}
.card h2{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:3px;height:13px;background:var(--gold);border-radius:2px;flex:none}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.pill{background:var(--panel2);border-radius:10px;padding:9px 11px}
.pill .nm{font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pill .hr{font-size:10.5px;color:var(--muted);font-weight:400}
.pill .qs{display:grid;gap:6px;margin-top:9px}
.pill .q{display:flex;align-items:center;justify-content:space-between;gap:6px;
  border-radius:8px;padding:5px 9px;background:rgba(255,255,255,.05)}
.pill .q i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:1px}
.pill .q b{font-size:15px;font-weight:700}
.pill .q.ok{background:rgba(52,199,123,.13);border:1px solid rgba(52,199,123,.45)}
.pill .q.ok b{color:var(--ok)}
.pill .q.warn{background:rgba(243,178,62,.15);border:1px solid rgba(243,178,62,.5)}
.pill .q.warn b{color:var(--warn)}
.pill .q.bad{background:rgba(235,92,92,.18);border:1px solid rgba(235,92,92,.6)}
.pill .q.bad b{color:#FF8A8A}
.pill .q.off{background:rgba(255,255,255,.04)}
.pill .q.off b{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 7px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:11.5px}
tbody tr:last-child td{border-bottom:0}
.tn b{font-weight:700}
.tn.ok b{color:var(--ok)} .tn.warn b{color:var(--warn)} .tn.bad b{color:#FF8A8A}
.cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.cam{background:var(--panel2);border-radius:10px;overflow:hidden}
.cam img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#0a1420}
.cam .lb{font-size:11px;color:var(--muted);padding:5px 8px;line-height:1.4}
.cam .lb em{font-style:normal;display:block;color:#6E82A0;font-size:10px;margin-top:2px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:13px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .big{font-size:26px;font-weight:700;line-height:1.15}
.hero .big small{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-top:3px}
.empty{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;
  padding:16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding:16px 0 8px;line-height:1.9}
footer a{color:var(--accent);text-decoration:none}
.err{background:rgba(235,92,92,.14);border:1px solid var(--bad);color:#FFD9D9;
  border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:13px;line-height:1.7}
.hide{display:none!important}
.loading{text-align:center;color:var(--muted);padding:34px 0;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <header>
    <h1 id="h1title">過關實況 <span>· 快照</span></h1>
    <div class="spacer"></div>
    <div class="stat" id="statgen">—</div>
    <div class="langs" id="langs"></div>
    <button class="btn" id="btnreload" onclick="load()">↻</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
</div>

<div class="wrap">
  <div class="fresh" id="freshline">…</div>
  <div id="errbox"></div>

  <!-- ══ 早報 ══ -->
  <section class="page" id="page-daily">
    <div class="grid">
      <div>
        <div class="card">
          <h2 id="h-crossing"></h2>
          <p class="sub" id="sub-crossing"></p>
          <div class="pills" id="crossing"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2 id="h-tunnel"></h2>
          <p class="sub" id="sub-tunnel"></p>
          <table><thead><tr id="thead-tunnel"></tr></thead><tbody id="tunnel"></tbody></table>
        </div>
        <div class="card">
          <h2 id="h-portsum"></h2>
          <p class="sub" id="sub-portsum"></p>
          <div id="portsum"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ══ 天氣 ══ -->
  <section class="page hide" id="page-weather">
    <div class="card">
      <h2 id="h-weather"></h2>
      <p class="sub" id="sub-weather"></p>
      <div id="weather"></div>
    </div>
  </section>

  <!-- ══ 交通 ══ -->
  <section class="page hide" id="page-traffic">
    <div class="card">
      <h2 id="h-traffic"></h2>
      <p class="sub" id="sub-traffic"></p>
      <table><thead><tr id="thead-traffic"></tr></thead><tbody id="traffic"></tbody></table>
    </div>
    <div class="card">
      <h2 id="h-cams"></h2>
      <p class="sub" id="sub-cams"></p>
      <div class="cams" id="cams"></div>
    </div>
  </section>

  <!-- ══ 自駕 ══ -->
  <section class="page hide" id="page-drive">
    <div class="card">
      <h2 id="h-drive"></h2>
      <p class="sub" id="sub-drive"></p>
      <div id="drive"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ==========================================================================
   過關實況 · 快照看板（2026-10-06）
   - 三語（繁 tc / 简 sc / EN），默認繁中，同小程序 utils/i18n.js 同一套寫法
   - 頂部 4 個 tab（早報／天氣／交通／自駕），同小程序 app.json tabBar 一致
   - 本頁係「定時快照」，唔係即時 → 頁面必須寫明更新頻率
   ========================================================================== */

const REFRESH_MIN = 30;              // 後台 Action 更新頻率（分鐘）
const CDN = "./live";                // snapshot.json 位置（同站相對路徑）
const CACHEBUST = () => "?t=" + Math.floor(Date.now() / 60000);

/* ---------------------------------------------------------------- 三語字典 */
const KEY = "dash_lang";
const T = {
  /* 共用 */
  title:      {tc:"過關實況",     sc:"过关实况",     en:"Crossing Live"},
  titleSub:   {tc:"· 快照",       sc:"· 快照",       en:"· Snapshot"},
  reload:     {tc:"重新載入",     sc:"重新加载",     en:"Reload"},
  footGen:    {tc:"本快照產生於 {t}（香港時間）· 每 {n} 分鐘更新一次",
               sc:"本快照生成于 {t}（香港时间）· 每 {n} 分钟更新一次",
               en:"Snapshot generated {t} (HKT) · refreshed every {n} min"},
  footnote:   {tc:"資料來源：香港入境事務處 · 香港天文台 · 香港運輸署<br>本頁為<b>定時快照</b>，非即時；實際情況請以官方「香港出行易」及各口岸現場為準",
               sc:"数据来源：香港入境事务处 · 香港天文台 · 香港运输署<br>本页为<b>定时快照</b>，非实时；实际情况请以官方「香港出行易」及各口岸现场为准",
               en:"Sources: HK Immigration Dept · HK Observatory · HK Transport Dept<br>This page is a <b>scheduled snapshot</b>, not real-time. Verify with the official 「HKeMobility」 app and on-site notices."},
  fresh:      {tc:"⏱ 本頁係<b>定時快照</b>，每 <b>{n} 分鐘</b>更新一次，並非即時。快照時間 <b>{t}</b>{age}　·　要即時數據請用官方「香港出行易」App。",
               sc:"⏱ 本页是<b>定时快照</b>，每 <b>{n} 分钟</b>更新一次，并非实时。快照时间 <b>{t}</b>{age}　·　要实时数据请用官方「香港出行易」App。",
               en:"⏱ This is a <b>scheduled snapshot</b>, refreshed every <b>{n} min</b> — not real-time. Snapshot taken <b>{t}</b>{age}　·　For live data use the official 「HKeMobility」 app."},
  freshNow:   {tc:"（約 {m} 分鐘前）", sc:"（约 {m} 分钟前）", en:" ({m} min ago)"},
  freshLate:  {tc:"（⚠️ 已 {m} 分鐘前，排程可能延遲）", sc:"（⚠️ 已 {m} 分钟前，排程可能延迟）", en:" (⚠️ {m} min ago · schedule may be delayed)"},
  loading:    {tc:"載入中⋯",       sc:"加载中⋯",       en:"Loading…"},
  loadFail:   {tc:"未能載入快照",   sc:"未能加载快照",   en:"Could not load snapshot"},
  errTxt:     {tc:"載入失敗：{e}<br>（如果係第一次部署，等 Action 跑完一次先）",
               sc:"加载失败：{e}<br>（如果是第一次部署，等 Action 跑完一次先）",
               en:"Load failed: {e}<br>(If this is the first deploy, wait for the Action to finish one run.)"},
  nodata:     {tc:"暫無數據",       sc:"暂无数据",       en:"No data"},
  waitFirst:  {tc:"等待首次快照產生⋯", sc:"等待首次快照生成⋯", en:"Waiting for the first snapshot…"},

  /* tab 名 */
  tabDaily:   {tc:"早報",  sc:"早报",  en:"Daily"},
  tabWeather: {tc:"天氣",  sc:"天气",  en:"Weather"},
  tabTraffic: {tc:"交通",  sc:"交通",  en:"Traffic"},
  tabDrive:   {tc:"自駕",  sc:"自驾",  en:"Drive"},

  /* 早報 */
  crossing:   {tc:"口岸等候（旅客）", sc:"口岸等候（旅客）", en:"Border waiting times (passengers)"},
  crossSub:   {tc:"入境處 · 資料時間 {t}（官方約 15 分鐘更新）", sc:"入境处 · 数据时间 {t}（官方约 15 分钟更新）", en:"ImmD · data at {t} (official refresh ~15 min)"},
  arrive:     {tc:"入境",  sc:"入境",  en:"Arrival"},
  depart:     {tc:"出境",  sc:"出境",  en:"Departure"},
  tunnel:     {tc:"過海隧道行車時間", sc:"过海隧道行车时间", en:"Cross-harbour tunnel journey times"},
  tunnelSub:  {tc:"運輸署 · 資料時間 {t}（官方約 2 分鐘更新）· 起點：{o}",
               sc:"运输署 · 数据时间 {t}（官方约 2 分钟更新）· 起点：{o}",
               en:"TD · data at {t} (official refresh ~2 min) · origin: {o}"},
  thTunnel:   {tc:"隧道", sc:"隧道", en:"Tunnel"},
  thDest:     {tc:"方向", sc:"方向", en:"Direction"},
  thMin:      {tc:"時間", sc:"时间", en:"Time"},
  thStatus:   {tc:"狀況", sc:"状况", en:"Status"},
  min:        {tc:"分鐘", sc:"分钟", en:"min"},
  portsum:    {tc:"口岸一覽", sc:"口岸一览", en:"All crossings at a glance"},
  portsumSub: {tc:"私家車方向 · 由實時等候狀況排序", sc:"私家车方向 · 由实时等候状况排序", en:"Best → worst by current waiting status"},
  tunnelNote: {tc:"＊此三條為「港島 → 九龍」過海方向車程，並非直達口岸路線",
               sc:"＊此三条为「港岛 → 九龙」过海方向车程，并非直达口岸路线",
               en:"* These three are island→Kowloon cross-harbour times, not direct routes to a border crossing."},

  /* 天氣 */
  weather:    {tc:"香港天氣", sc:"香港天气", en:"Hong Kong weather"},
  weatherSub: {tc:"天文台 · 資料時間 {t}", sc:"天文台 · 数据时间 {t}", en:"HKO · data at {t}"},
  temp:       {tc:"氣溫", sc:"气温", en:"Temp"},
  humidity:   {tc:"濕度", sc:"湿度", en:"Humidity"},
  uv:         {tc:"紫外線", sc:"紫外线", en:"UV"},
  uvDesc:     {tc:"紫外線 {d}", sc:"紫外线 {d}", en:"UV {d}"},
  warnings:   {tc:"⚠️ 生效警告：{w}", sc:"⚠️ 生效警告：{w}", en:"⚠️ Active warnings: {w}"},
  forecast7:  {tc:"未來數日", sc:"未来数日", en:"Next few days"},
  thDate:     {tc:"日期", sc:"日期", en:"Date"},
  thWx:       {tc:"天氣", sc:"天气", en:"Weather"},
  thTemp:     {tc:"溫度", sc:"温度", en:"Temp"},
  situation:  {tc:"概況", sc:"概况", en:"Situation"},

  /* 交通 */
  traffic:    {tc:"路面交通", sc:"路面交通", en:"Road traffic"},
  trafficSub: {tc:"運輸署 JTIS · 資料時間 {t}（官方約 2 分鐘更新）· 起點：{o}",
               sc:"运输署 JTIS · 数据时间 {t}（官方约 2 分钟更新）· 起点：{o}",
               en:"TD JTIS · data at {t} (official refresh ~2 min) · origin: {o}"},
  cams:       {tc:"口岸路面快拍", sc:"口岸路面快拍", en:"Crossing road snapshots"},
  camsSub:    {tc:"運輸署鏡頭 · 每 2 分鐘更新；圖片直連官方原圖，唔會轉存",
               sc:"运输署镜头 · 每 2 分钟更新；图片直连官方原图，不会转存",
               en:"TD cameras · 2 min refresh; images link straight to the official source, never re-hosted"},
  camFoot:    {tc:"畫面版權：運輸署（可轉發）", sc:"画面版权：运输署（可转发）", en:"Image: Transport Department"},

  /* 自駕 */
  drive:      {tc:"自駕過關 · 各口岸車程", sc:"自驾过关 · 各口岸车程", en:"Driving to the border · journey times"},
  driveSub:   {tc:"運輸署 TDAS 實時車程 · 資料時間 {t}", sc:"运输署 TDAS 实时车程 · 数据时间 {t}", en:"TD TDAS live journey times · data at {t}"},
  driveSlow:  {tc:"（車程快照更新較疏，通常每小時內）", sc:"（车程快照更新较疏，通常每小时内）", en:" (drive snapshot refreshes less often, usually within the hour)"},
  driveEmpty: {tc:"車程快照暫時未有（未跑過或抓取失敗）· 稍後再試",
               sc:"车程快照暂时未有（未跑过或抓取失败）· 稍后再试",
               en:"No drive snapshot yet (not run, or the fetch failed). Try again later."},
  thPort:     {tc:"口岸", sc:"口岸", en:"Crossing"},
  thEta:      {tc:"車程", sc:"车程", en:"Drive time"},
  thSpd:      {tc:"均速", sc:"均速", en:"Avg speed"},
  driveNote:  {tc:"車程只計香港境內路面 · 未計口岸排隊", sc:"车程只计香港境内路面 · 未计口岸排队", en:"HK-side roads only · excludes border queue"},
  origins:    {tc:"起點", sc:"起点", en:"Origin"},

  /* 燈號用字（同口岸 0/1/2 狀態） */
  s0: {tc:"暢通", sc:"畅通", en:"Clear"},
  s1: {tc:"繁忙", sc:"繁忙", en:"Busy"},
  s2: {tc:"非常繁忙", sc:"非常繁忙", en:"Very busy"},
  s4: {tc:"維護中", sc:"维护中", en:"Maintenance"},
  s99:{tc:"未開閘", sc:"未开闸", en:"Closed"},
  sX: {tc:"未知", sc:"未知", en:"Unknown"},
  sc1:{tc:"擠塞", sc:"挤塞", en:"Congested"},
  sc2:{tc:"繁忙", sc:"繁忙", en:"Busy"},
  sc3:{tc:"暢通", sc:"畅通", en:"Clear"},

  /* 語言 pill 標籤 */
  langTc: {tc:"繁", sc:"繁", en:"TC"},
  langSc: {tc:"简", sc:"简", en:"SC"},
  langEn: {tc:"EN", sc:"EN", en:"EN"}
};

let _lang = "";
function getLang(){
  if(!_lang){
    try{ _lang = localStorage.getItem(KEY) || "tc"; }catch(e){ _lang = "tc"; }
    if(["tc","sc","en"].indexOf(_lang) < 0) _lang = "tc";
  }
  return _lang;
}
function setLang(l){
  if(["tc","sc","en"].indexOf(l) < 0) return;
  _lang = l;
  try{ localStorage.setItem(KEY, l); }catch(e){}
}
/** T.xxx -> 當前語言文字 */
function L(k){
  const o = T[k];
  if(!o) return k;
  return o[getLang()] || o.tc || "";
}
/** 帶 {x} 佔位符 */
function LF(k, vars){
  let s = L(k);
  Object.keys(vars || {}).forEach(function(x){
    s = s.split("{" + x + "}").join(vars[x]);
  });
  return s;
}

/* ---------------------------------------------------------------- 小工具 */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
const QMAP = {ok:"ok", warn:"warn", bad:"bad", off:"off"};
/** 顏色等級 → 當前語言的狀態字 */
function lvTxt(lv){
  if(lv==="ok")  return L("s0");
  if(lv==="warn")return L("s1");
  if(lv==="bad") return L("s2");
  return L("sX");
}
/** 隧道狀態（JTIS 用 ok/warn/bad，但語意係暢通／繁忙／塞車） */
function tunnelLvTxt(lv){
  if(lv==="ok")  return L("sc3");
  if(lv==="warn")return L("sc2");
  if(lv==="bad") return L("sc1");
  return "—";
}

/* 口岸中文名 → 三語（ImmD 只出簡體名，需要時自己轉） */
const PORT_NAME = {
  "罗湖":  {tc:"羅湖", sc:"罗湖", en:"Lo Wu"},
  "福田":  {tc:"福田", sc:"福田", en:"Futian"},
  "皇岗":  {tc:"皇崗", sc:"皇岗", en:"Huanggang"},
  "深圳湾":{tc:"深圳灣", sc:"深圳湾", en:"Shenzhen Bay"},
  "莲塘":  {tc:"蓮塘", sc:"莲塘", en:"Liantang"},
  "文锦渡":{tc:"文錦渡", sc:"文锦渡", en:"Man Kam To"},
  "港珠澳大桥":{tc:"港珠澳大橋", sc:"港珠澳大桥", en:"HZMB"}
};
function portName(n){
  const o = PORT_NAME[n];
  return o ? (o[getLang()] || o.tc) : n;
}
/* 星期 */
const WEEK = {
  "星期一":{tc:"星期一",sc:"星期一",en:"Mon"}, "星期二":{tc:"星期二",sc:"星期二",en:"Tue"},
  "星期三":{tc:"星期三",sc:"星期三",en:"Wed"}, "星期四":{tc:"星期四",sc:"星期四",en:"Thu"},
  "星期五":{tc:"星期五",sc:"星期五",en:"Fri"}, "星期六":{tc:"星期六",sc:"星期六",en:"Sat"},
  "星期日":{tc:"星期日",sc:"星期日",en:"Sun"}, "星期天":{tc:"星期日",sc:"星期天",en:"Sun"}
};
function weekName(w){
  const o = WEEK[w];
  return o ? (o[getLang()] || o.tc) : w;
}

/* ---------------------------------------------------------------- tab 定義 */
const TABS = [
  {id:"daily",   icon:"📰", key:"tabDaily"},
  {id:"weather", icon:"🌤", key:"tabWeather"},
  {id:"traffic", icon:"🚗", key:"tabTraffic"},
  {id:"drive",   icon:"🛣", key:"tabDrive"}
];
let curTab = "daily";
try{ curTab = localStorage.getItem("dash_tab") || "daily"; }catch(e){}

/* ---------------------------------------------------------------- 語言列 */
function renderLangs(){
  const arr = [["tc","langTc"],["sc","langSc"],["en","langEn"]];
  document.getElementById("langs").innerHTML = arr.map(function(p){
    return '<button class="' + (getLang()===p[0]?"on":"") +
      '" onclick="pickLang(\'' + p[0] + '\')">' + esc(L(p[1])) + '</button>';
  }).join("");
}
function pickLang(l){
  setLang(l);
  document.documentElement.lang = (l==="en" ? "en" : (l==="sc" ? "zh-Hans" : "zh-Hant"));
  renderLangs();
  paintStatic();
  if(lastData) render(lastData.meta, lastData.snap, lastData.drive);
}

/* ---------------------------------------------------------------- tab 列 */
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button class="' + (curTab===t.id?"on":"") + '" data-tab="' + t.id +
      '" onclick="pickTab(\'' + t.id + '\')"><span class="ic">' + t.icon + '</span>' +
      esc(L(t.key)) + '</button>';
  }).join("");
}
function pickTab(id){
  curTab = id;
  try{ localStorage.setItem("dash_tab", id); }catch(e){}
  TABS.forEach(function(t){
    document.getElementById("page-" + t.id).classList.toggle("hide", t.id !== id);
  });
  renderTabs();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------------------------------------------------------- 靜態文字 */
function paintStatic(){
  document.title = L("title") + " · " + L("titleSub").replace("· ","");
  document.getElementById("h1title").innerHTML =
    esc(L("title")) + ' <span>' + esc(L("titleSub")) + '</span>';
  document.getElementById("btnreload").textContent = "↻";
  document.getElementById("btnreload").title = L("reload");
  document.getElementById("foot").innerHTML = L("footnote") +
    '<br><span id="foot-gen"></span>';

  document.getElementById("h-crossing").textContent = L("crossing");
  document.getElementById("h-tunnel").textContent   = L("tunnel");
  document.getElementById("h-portsum").textContent  = L("portsum");
  document.getElementById("h-weather").textContent  = L("weather");
  document.getElementById("h-traffic").textContent  = L("traffic");
  document.getElementById("h-cams").textContent     = L("cams");
  document.getElementById("h-drive").textContent    = L("drive");
  document.getElementById("sub-portsum").textContent = L("portsumSub");
  document.getElementById("sub-cams").textContent   = L("camsSub");

  document.getElementById("thead-tunnel").innerHTML =
    "<th>" + esc(L("thTunnel")) + "</th><th>" + esc(L("thDest")) + "</th>" +
    "<th>" + esc(L("thMin")) + "</th><th>" + esc(L("thStatus")) + "</th>";
  document.getElementById("thead-traffic").innerHTML =
    "<th>" + esc(L("thTunnel")) + "</th><th>" + esc(L("thDest")) + "</th>" +
    "<th>" + esc(L("thMin")) + "</th><th>" + esc(L("thStatus")) + "</th>";
}

/* ---------------------------------------------------------------- 讀資料 */
let lastData = null;

async function load(){
  document.getElementById("errbox").innerHTML = "";
  try{
    const meta = await (await fetch(CDN + "/snapshot_meta.json" + CACHEBUST())).json();
    const snap = await (await fetch(CDN + "/snapshot.json" + CACHEBUST())).json();
    // 自駕快照係另一支 workflow 寫嘅（每小時／每日幾次），可能唔存在 → 容錯
    let drive = null;
    try{
      const r = await fetch(CDN + "/drive.json" + CACHEBUST());
      if(r.ok) drive = await r.json();
    }catch(e){}
    lastData = {meta:meta, snap:snap, drive:drive};
    render(meta, snap, drive);
  }catch(e){
    document.getElementById("errbox").innerHTML =
      '<div class="err">' + LF("errTxt", {e: esc(e.message)}) + '</div>';
    document.getElementById("freshline").textContent = L("loadFail");
  }
}

function render(meta, snap, drive){
  const gen = (meta && meta.generated) || (snap && snap.generated) || "—";
  document.getElementById("statgen").textContent = gen;
  const fg = document.getElementById("foot-gen");
  if(fg) fg.textContent = LF("footGen", {t: gen, n: REFRESH_MIN});

  // 新鮮度
  let age = "";
  try{
    const t0 = new Date(gen.replace(" ","T") + ":00+08:00").getTime();
    const m = Math.round((Date.now() - t0) / 60000);
    age = (m <= REFRESH_MIN * 2) ? LF("freshNow", {m:m}) : LF("freshLate", {m:m});
  }catch(e){}
  document.getElementById("freshline").innerHTML =
    LF("fresh", {n: REFRESH_MIN, t: esc(gen), age: age});

  renderCrossing(snap.crossing || {});
  renderTunnel(snap.tunnel || {});
  renderPortSum(snap.crossing || {});
  renderTrafficTab(snap.tunnel || {});
  renderWeather(snap.weather || {});
  renderCams((snap.cams && snap.cams.main) || []);
  renderDrive(drive || snap.drive || null);
}

/* ---- 口岸等候 ---- */
function renderCrossing(cx){
  document.getElementById("sub-crossing").textContent =
    LF("crossSub", {t: cx.updated || "—"});
  const rows = cx.rows || [];
  if(!rows.length){
    document.getElementById("crossing").innerHTML =
      '<div class="empty">' + esc(L("nodata")) + '</div>';
    return;
  }
  document.getElementById("crossing").innerHTML = rows.map(function(r){
    return '<div class="pill"><div class="nm">' + esc(portName(r.name)) +
      '<span class="hr">' + esc(r.hours) + '</span></div>' +
      '<div class="qs">' +
      '<div class="q ' + (QMAP[r.arrLv]||"off") + '"><i>' + esc(L("arrive")) + '</i><b>' +
        esc(lvTxt(r.arrLv)) + '</b></div>' +
      '<div class="q ' + (QMAP[r.depLv]||"off") + '"><i>' + esc(L("depart")) + '</i><b>' +
        esc(lvTxt(r.depLv)) + '</b></div>' +
      '</div></div>';
  }).join("");
}

/* ---- 過海隧道 ---- */
function tunnelRows(rows){
  if(!rows || !rows.length) return '<tr><td colspan="4">' + esc(L("nodata")) + '</td></tr>';
  return rows.map(function(r){
    return '<tr><td>' + esc(portName(r.name)) + '</td><td>' + esc(portName(r.dest)) + '</td>' +
      '<td class="tn ' + esc(r.lv) + '"><b>' + esc(r.min) + ' ' + esc(L("min")) + '</b></td>' +
      '<td class="tn ' + esc(r.lv) + '">' + esc(tunnelLvTxt(r.lv)) + '</td></tr>';
  }).join("");
}
function renderTunnel(tn){
  document.getElementById("sub-tunnel").textContent =
    LF("tunnelSub", {t: tn.updated || "—", o: tn.origin || "—"}) + "　" + L("tunnelNote");
  document.getElementById("tunnel").innerHTML = tunnelRows(tn.rows);
}

/* ---- 口岸一覽（排序卡）---- */
function renderPortSum(cx){
  const rows = (cx.rows || []).slice();
  // 唔好嘅排前面（bad > warn > ok > off）
  const rank = {bad:0, warn:1, ok:2, off:3};
  rows.sort(function(a,b){
    return Math.min(rank[a.arrLv]??9, rank[a.depLv]??9) -
           Math.min(rank[b.arrLv]??9, rank[b.depLv]??9);
  });
  const top = rows.slice(0,3);
  if(!top.length){
    document.getElementById("portsum").innerHTML =
      '<div class="empty">' + esc(L("nodata")) + '</div>';
    return;
  }
  document.getElementById("portsum").innerHTML = top.map(function(r){
    const worst = (rank[r.arrLv]??9) <= (rank[r.depLv]??9) ? r.arrLv : r.depLv;
    return '<div class="pill" style="margin-bottom:8px"><div class="nm">' +
      esc(portName(r.name)) + '<span class="hr">' + esc(r.hours) + '</span></div>' +
      '<div class="qs"><div class="q ' + (QMAP[worst]||"off") + '">' +
      '<i>' + esc(L("arrive")) + ' / ' + esc(L("depart")) + '</i><b>' +
      esc(lvTxt(r.arrLv)) + ' / ' + esc(lvTxt(r.depLv)) + '</b></div></div></div>';
  }).join("");
}

/* ---- 天氣 ---- */
function renderWeather(w){
  document.getElementById("sub-weather").textContent =
    LF("weatherSub", {t: w.updated || "—"});
  let h = "";
  if(w.warnings && w.warnings.length)
    h += '<div class="err">' + esc(LF("warnings", {w: w.warnings.join("、")})) + '</div>';

  h += '<div class="pills" style="margin-bottom:10px">' +
    '<div class="pill"><div class="nm">' + (w.temp!=null ? esc(w.temp)+'°C' : '—') + '</div>' +
    '<div class="sub" style="margin:4px 0 0">' + esc(L("temp")) + '</div></div>' +
    '<div class="pill"><div class="nm">' + (w.humidity!=null ? esc(w.humidity)+'%' : '—') + '</div>' +
    '<div class="sub" style="margin:4px 0 0">' + esc(L("humidity")) + '</div></div>' +
    '<div class="pill"><div class="nm">' + (w.uv!=null ? esc(w.uv) : '—') + '</div>' +
    '<div class="sub" style="margin:4px 0 0">' +
      esc(LF("uvDesc", {d: w.uvDesc || ""})) + '</div></div>' +
    '</div>';

  if(w.forecast)
    h += '<p class="sub" style="font-size:13px;color:var(--fg);line-height:1.75">' +
      esc(w.forecast) + '</p>';

  const days = (w.days || []).slice(0,5);
  if(days.length){
    h += '<p class="sub" style="margin-top:12px;font-weight:600;color:var(--fg)">' +
      esc(L("forecast7")) + '</p>' +
      '<table><thead><tr><th>' + esc(L("thDate")) + '</th><th>' + esc(L("thWx")) +
      '</th><th>' + esc(L("thTemp")) + '</th></tr></thead><tbody>';
    days.forEach(function(d){
      h += '<tr><td style="white-space:nowrap">' + esc(weekName(d.week) || d.date) + '</td>' +
        '<td style="font-size:12px">' + esc(d.txt || "") + '</td>' +
        '<td style="white-space:nowrap">' + esc(d.min) + '–' + esc(d.max) + '°C</td></tr>';
    });
    h += '</tbody></table>';
  }
  document.getElementById("weather").innerHTML = h;
}

/* ---- 交通 tab 的隧道表 ---- */
function renderTrafficTab(tn){
  document.getElementById("sub-traffic").textContent =
    LF("trafficSub", {t: tn.updated || "—", o: tn.origin || "—"});
  document.getElementById("traffic").innerHTML = tunnelRows(tn.rows);
}

/* ---- 快拍（直連運輸署原圖）---- */
function renderCams(cams){
  const box = document.getElementById("cams");
  if(!cams.length){
    box.innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(L("nodata")) + '</div>';
    return;
  }
  const t = Math.floor(Date.now()/120000);   // 每 2 分鐘換 cache key（官方 2 分鐘更新）
  box.innerHTML = cams.map(function(c){
    return '<div class="cam"><img loading="lazy" alt="' + esc(c.seg) + '" ' +
      'src="https://tdcctv.data.one.gov.hk/' + esc(c.key) + '.JPG?t=' + t + '">' +
      '<div class="lb">' + esc(c.seg) +
      (c.use ? '<em>' + esc(c.use) + '</em>' : '') + '</div></div>';
  }).join("");
}

/* ---- 自駕 ---- */
function renderDrive(dr){
  const box = document.getElementById("drive");
  if(!dr || !dr.rows){
    document.getElementById("sub-drive").textContent = '';
    box.innerHTML = '<div class="empty">' + esc(L("driveEmpty")) + '</div>';
    return;
  }
  document.getElementById("sub-drive").textContent =
    LF("driveSub", {t: dr.updated || "—"}) + L("driveSlow") + "　" + L("driveNote");
  const origins = dr.origins || [];
  let h = '<div style="overflow-x:auto"><table><thead><tr><th>' + esc(L("thPort")) + '</th>';
  origins.forEach(function(o){ h += '<th>' + esc(o) + '</th>'; });
  h += '</tr></thead><tbody>';
  (dr.rows || []).forEach(function(r){
    h += '<tr><td style="white-space:nowrap">' + esc(portName(r.port)) + '</td>';
    (r.cells || []).forEach(function(c){
      if(!c){ h += '<td style="color:var(--muted)">—</td>'; return; }
      h += '<td class="tn ' + esc(c.lv) + '"><b>' + esc(c.eta || "—") + '</b><br>' +
        '<span style="font-size:11px;color:var(--muted)">' + esc(c.speed || 0) + ' km/h</span></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  box.innerHTML = h;
}

/* ---------------------------------------------------------------- 啟動 */
renderLangs();
renderTabs();
paintStatic();
document.documentElement.lang = (getLang()==="en" ? "en" : (getLang()==="sc" ? "zh-Hans" : "zh-Hant"));
pickTab(curTab);
load();
setInterval(load, 5 * 60 * 1000);   // 前端每 5 分鐘自讀（後台 15 分鐘才更新）
</script>
</body>
</html>
