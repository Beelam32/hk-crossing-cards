<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>香港卡簿 · 每日一卡</title>
<meta name="description" content="香港天氣、口岸實況、行山路線、地區指南——每日更新的卡簿合集">
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1e21; --sub:#6b7280;
    --accent:#c8452c; --line:#e7e4de; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  header{position:sticky;top:0;z-index:50;background:rgba(246,245,242,.92);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .head-in{max-width:1080px;margin:0 auto;padding:14px 16px 10px}
  h1{font-size:22px;font-weight:800;letter-spacing:1px}
  h1 .hk{color:var(--accent)}
  .tagline{font-size:12.5px;color:var(--sub);margin-top:2px}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 2px}
  nav::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 16px;border-radius:999px;border:1px solid var(--line);
        background:var(--card);font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .set{margin:0 0 22px}
  .set-h{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .set-t{font-size:14.5px;font-weight:600}
  .set-t small{font-weight:400;color:var(--sub);margin-left:6px;font-size:12px}
  .copybtn{border:1px solid var(--line);background:var(--card);border-radius:999px;
           padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .copybtn:active{background:var(--ink);color:#fff}
  #cpbox{display:none;position:fixed;inset:0;background:rgba(20,22,26,.55);z-index:60;
         align-items:center;justify-content:center;padding:18px}
  .cp-card{background:var(--card);border-radius:var(--radius);max-width:640px;width:100%;
           max-height:80vh;display:flex;flex-direction:column}
  .cp-h{display:flex;justify-content:space-between;align-items:center;
        padding:12px 16px;border-bottom:1px solid var(--line)}
  .cp-h .x{font-size:22px;cursor:pointer;color:var(--sub);margin-left:10px;line-height:1}
  #cptxt{margin:0;padding:14px 16px;overflow:auto;white-space:pre-wrap;
         word-break:break-word;font-size:13.5px;line-height:1.8;
         font-family:inherit;flex:1}
  .chip .n{opacity:.55;font-size:11.5px;margin-left:4px}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .sec-title{font-size:16px;font-weight:700;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
  .sec-title small{color:var(--sub);font-weight:400;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .ph{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
  .ph:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .ph img{width:100%;display:block;aspect-ratio:3/4.4;object-fit:cover;object-position:top;
          background:linear-gradient(135deg,#eceae5,#f7f6f3)}
  .cap{padding:8px 10px 9px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--sub);font-size:14px;padding:40px 0;text-align:center}
  footer{max-width:1080px;margin:0 auto;padding:0 16px 50px;font-size:12px;color:var(--sub)}
  footer a{color:var(--accent)}
  #lb{position:fixed;inset:0;background:rgba(20,20,22,.92);z-index:100;display:none;
      align-items:center;justify-content:center;cursor:zoom-out}
  #lb img{max-width:96vw;max-height:94vh;border-radius:8px}
  #lb .x{position:fixed;top:14px;right:20px;color:#fff;font-size:30px;cursor:pointer}
  .load{color:var(--sub);font-size:13px;padding:60px 0;text-align:center}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <h1>香港<span class="hk">卡簿</span></h1>
    <div class="tagline">天氣 · 口岸 · 山系 · 地區 · 攻略 —— 圖庫即時同步</div>
    <nav id="nav"></nav>
  </div>
</header>
<main>
  <div class="load" id="loading">讀取圖庫中……</div>
  <div id="content"></div>
</main>
<footer>
  資料來源：香港天文台、入境事務處、深圳 i口岸 ｜ 卡片由
  <a href="https://github.com/Beelam32/hk-crossing-daily-card">hk-crossing-daily-card</a>
  每日自動生成 ｜ <span id="total"></span>
</footer>
<div id="lb"><span class="x">×</span><img id="lbimg" alt=""></div>
<div id="cpbox"><div class="cp-card">
  <div class="cp-h"><b>小紅書文案</b><span>
    <button id="cpok" class="copybtn" onclick="copyText()">📋 複製全文</button>
    <span class="x" onclick="closeCopy()">×</span></span></div>
  <pre id="cptxt"></pre>
</div></div>

<script>
const RAW=p=>'https://raw.githubusercontent.com/Beelam32/hk-crossing-cards/main/'+p;
const SERIES=[
  {key:'daily',  title:'過關日報', desc:'天氣 · 口岸實況 · CCTV 快拍，每日更新',
   match:n=>/^(card_sc_|sc_weather|cctv_card|sc_cctv|sc_pair_weather)/.test(n)},
  {key:'hike',   title:'山系香港', desc:'行山路線 · 裝備 · 路況',
   match:n=>/hike|dragon|baxian|qiandao|taisandung|taitong|lym/i.test(n)&&!/copy_/.test(n)},
  {key:'spot',   title:'地區指南', desc:'港九新界各區 · 深圳景點',
   match:n=>/^(spot_card_|cn_card_)/.test(n)},
  {key:'rules',  title:'規則攻略', desc:'交通 · 垃圾 · 馬路規則等實用守則',
   match:n=>/^rules_card/.test(n)},
  {key:'taste',  title:'香港味道', desc:'煲仔飯 · 老字號 · 街頭小食',
   match:n=>/^(taste_|sc_taste_)/.test(n)},
  {key:'misc',   title:'特別企劃', desc:'週報 · 日曆 · 專題卡 · 口岸交通攻略',
   match:n=>/^(weekly_card|calendar|drive_card|ports_card|sc_daily_|special_card|med_card|money_card|fireworks_card|hk_card|port_cams)/.test(n)},
];
const IMG=/\.(png|jpe?g|webp)$/i;
function dateOf(n){const m=n.match(/(\d{8})/);return m?m[1]:''}
function capOf(n){
  const base=n.split('/').pop().replace(/\.(png|jpe?g|webp)$/i,'');
  const d=dateOf(base);
  if(d){const nice=`${d.slice(4,6)}月${d.slice(6,8)}日`;
    const extra=base.replace(d,'').replace(/^_+/,'').replace(/_+$/,'');
    return extra?`${nice} · ${extra}`:nice;}
  return base.replace(/_/g,' ').replace(/card/i,'').trim()||base;
}
let ALL=[],SETS=[],cur='all';
function seriesOf(n){for(const s of SERIES)if(s.match(n))return s.key;return null}
function render(){
  const el=document.getElementById('content');el.innerHTML='';
  const inSet=new Set();SETS.forEach(x=>x.cards.forEach(n=>inSet.add(n)));
  for(const s of SERIES){
    // 套卡（有 set 資料嘅）
    const sets=SETS.filter(x=>x.cards.length&&s.match(x.cards[0]))
                   .filter(x=>cur==='all'||cur===s.key);
    // 散卡（唔屬於任何套嘅）
    const loose=ALL.filter(x=>!inSet.has(x.name)&&s.match(x.name)
                   &&(cur==='all'||cur===s.key));
    if(!sets.length&&!loose.length)continue;
    const sec=document.createElement('section');
    sec.innerHTML=`<div class="sec-title">${s.title}<small>${s.desc} · ${sets.reduce((a,x)=>a+x.cards.length,0)+loose.length} 張</small></div>`;
    for(const st of sets){
      const wrap=document.createElement('div');wrap.className='set';
      const hdr=document.createElement('div');hdr.className='set-h';
      hdr.innerHTML=`<span class="set-t">${st.title}<small>${st.cards.length} 張</small></span>`;
      if(st.copy){
        const b=document.createElement('button');b.className='copybtn';
        b.textContent='📋 文案';
        b.onclick=e=>{e.stopPropagation();showCopy(st)};
        hdr.appendChild(b);
      }
      wrap.appendChild(hdr);
      const g=document.createElement('div');g.className='grid';
      addImgs(g,st.cards.map(n=>({name:n})));
      wrap.appendChild(g);sec.appendChild(wrap);
    }
    if(loose.length){
      const g=document.createElement('div');g.className='grid';
      addImgs(g,loose);
      sec.appendChild(g);
    }
    el.appendChild(sec);
  }
  if(!el.children.length)el.innerHTML='<div class="empty">呢本卡簿仲未收到卡</div>';
}
function addImgs(g,items){
  for(const it of items){
    const d=document.createElement('div');d.className='ph';
    d.innerHTML=`<img loading="lazy" src="${RAW(it.path)}" alt="">
                 <div class="cap">${capOf(it.name)}</div>`;
    d.onclick=()=>{document.getElementById('lbimg').src=RAW(it.path);
                   document.getElementById('lb').style.display='flex'};
    g.appendChild(d);
  }
}
function showCopy(st){
  const box=document.getElementById('cpbox'),pre=document.getElementById('cptxt');
  pre.textContent='載入中……';box.style.display='flex';
  fetch(RAW(st.copy)).then(r=>r.text()).then(t=>{pre.textContent=t;pre.dataset.raw=t})
    .catch(()=>{pre.textContent='讀唔到文案'});
}
function closeCopy(){document.getElementById('cpbox').style.display='none'}
function copyText(){
  const t=document.getElementById('cptxt').dataset.raw||'';
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .then(()=>{const b=document.getElementById('cpok');b.textContent='✓ 已複製';
               setTimeout(()=>b.textContent='📋 複製全文',1500)})
    .catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('cptxt'));
                const s=getSelection();s.removeAllRanges();s.addRange(r)});
}
function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  const mk=(label,key,count)=>{
    const c=document.createElement('div');
    c.className='chip'+(cur===key?' on':'');
    c.innerHTML=`${label}<span class="n">${count}</span>`;
    c.onclick=()=>{
      cur=key;renderNav();render();
      if(key!=='all'){
        const i=SERIES.findIndex(x=>x.key===key);
        document.querySelectorAll('main section')[i]?.scrollIntoView({behavior:'smooth'});
      }else window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(c);
  };
  mk('全部','all',ALL.length);
  for(const s of SERIES)mk(s.title,s.key,ALL.filter(x=>s.match(x.name)).length);
}
/* 主源：同倉 manifest.json（日更 workflow 每次出卡自動重建）；
   後備：GitHub API tree（限流，僅 manifest 未建好嗰陣用） */
function boot(j){
  ALL=j.cards;SETS=j.sets||[];
  document.getElementById('loading').style.display='none';
  document.getElementById('total').textContent=`收錄 ${ALL.length} 張卡`;
  renderNav();render();
}
fetch('manifest.json?ts='+Date.now())
 .then(r=>{if(!r.ok)throw 0;return r.json()})
 .then(j=>boot(j))
 .catch(()=>fetch('https://api.github.com/repos/Beelam32/hk-crossing-cards/git/trees/main?recursive=0')
   .then(r=>r.json())
   .then(t=>{
     const out=t.tree.find(x=>x.path==='output');
     if(!out)throw 0;
     return fetch(out.url).then(r=>r.json());
   })
   .then(sub=>boot({cards:sub.tree.filter(x=>x.type==='blob'&&IMG.test(x.path))
                      .map(x=>({path:'output/'+x.path,name:x.path}))
                      .sort((a,b)=>b.name.localeCompare(a.name))}))
   .catch(()=>{document.getElementById('loading').textContent='讀唔到圖庫，請刷新再試'}));
document.getElementById('lb').onclick=()=>document.getElementById('lb').style.display='none';
document.getElementById('cpbox').onclick=e=>{if(e.target.id==='cpbox')closeCopy()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  document.getElementById('lb').style.display='none';closeCopy()}});
</script>
</body>
</html>
